<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formula card mockup</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../vendor/fonts/atkinson.css">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<script src="../../vendor/katex/katex.min.js"></script>
<style>
/* Easy mode formula card (design/EASY.md Phase 3, design/FORMULA-CARD.md). ?v=1..5. Phone (< 720px) and desktop from the viewport.
   Generic physics only (no exam text in the repo). app.css tokens only; the dashed strip is mock chrome. */
body { padding: 0 !important; }
.mbar { display: flex; gap: var(--s2); align-items: center; padding: var(--s2) var(--gut); border-bottom: 1px dashed var(--line); background: var(--field);
  color: var(--muted); font-size: var(--t-xs); }
.mbar b { color: var(--ink); }
.wrap { max-width: var(--col); margin: 0 auto; padding: var(--s4) var(--gut) var(--s7); }
.desk .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
.p { background: var(--qbox); border-radius: 10px; padding: var(--s4) 1.25rem; font-size: var(--t-md); line-height: var(--lh); }
.p p { margin: 0 0 var(--s2); }
.tipl { margin: 0 0 var(--s3); font-size: var(--t-sm); font-weight: 700; }
.ff { display: flex; align-items: center; height: var(--fld); margin-top: var(--s3); padding-left: var(--s3); border: var(--bw) solid var(--edge);
  border-radius: 10px; background: var(--field); color: var(--hint); font-size: var(--t-md); }
.ff span { flex: 1; }
.ff i { width: var(--btn); height: var(--btn); margin-right: 2px; border-radius: 8px; background: var(--c1); opacity: .45; }
.k { white-space: nowrap; }

/* ---------- the card, 5 ways ---------- */
.fc { margin-top: var(--s4); }
.fc h3 { margin: 0 0 var(--s2); font-size: var(--t-xs); font-weight: 700; color: var(--muted); }
/* 1 Recipe card: one sheet-coloured card, rows aligned on "=", the sheet group as a small label */
.v1 { background: var(--sheet); border: var(--bw) solid var(--line); border-radius: 10px; padding: var(--s3) var(--s4); }
.v1 .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: var(--s3); padding: var(--s2) 0; border-top: 1px solid var(--line); }
.v1 .row:first-of-type { border-top: 0; }
.v1 .g { color: var(--hint); font-size: var(--t-xs); }
/* 2 Ingredient chips: one scrollable row of pills; tap a pill = it opens under the row (phone friendly) */
.v2 .chips { display: flex; gap: var(--s2); overflow-x: auto; padding-bottom: var(--s1); }
.v2 .chip { flex: none; padding: var(--s2) var(--s3); border: var(--bw) solid var(--edge); border-radius: 999px; background: var(--sheet); font-size: var(--t-sm); }
.v2 .chip.on { background: var(--raised); border-color: var(--muted); }
.v2 .open { margin-top: var(--s2); padding: var(--s3) var(--s4); border-radius: 10px; background: var(--raised); }
/* 3 Side rail (desktop) / fold strip (phone): never in the reading column on desktop */
.desk .v3wrap { display: grid; grid-template-columns: minmax(0, 1fr) 17rem; gap: var(--s4); align-items: start; }
.v3 { background: var(--sheet); border-radius: 10px; padding: var(--s3); position: sticky; top: var(--s4); }
.v3 .row { padding: var(--s2) 0; border-top: 1px solid var(--line); } .v3 .row:first-of-type { border-top: 0; }
.phone .v3 { padding: 0; } .phone .v3 summary { list-style: none; display: flex; justify-content: space-between; padding: var(--s3) var(--s4); font-weight: 700; font-size: var(--t-sm); }
.phone .v3 .rows { padding: 0 var(--s4) var(--s3); }
/* 4 The real sheet, highlighted: the whole sheet group, the rows this question needs lit, the rest dimmed (find it on paper later) */
.v4 { background: var(--sheet); border-radius: 10px; padding: var(--s3) var(--s4); }
.v4 .row { display: flex; gap: var(--s3); align-items: baseline; padding: var(--s2) var(--s2); border-radius: 6px; color: var(--hint); }
.v4 .row.use { color: var(--ink); background: var(--raised); font-weight: 700; }
.v4 .n { width: 1.5rem; color: var(--hint); font-size: var(--t-xs); }
/* 5 Steps: the formulas in the order they get used, numbered, "then" between them */
.v5 ol { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.v5 li { counter-increment: s; display: grid; grid-template-columns: 2rem 1fr; gap: var(--s2); align-items: center; padding: var(--s2) 0; }
.v5 li::before { content: counter(s); display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--raised); font-weight: 700; font-size: var(--t-sm); }
.v5 .then { margin-left: 2.5rem; color: var(--hint); font-size: var(--t-xs); }
.v5 .say { color: var(--muted); font-size: var(--t-sm); }
</style>
</head>
<body>
<div class="mbar"><b>Formula card</b><span id="lab"></span></div>
<div class="wrap" id="wrap"></div>
<script>
const v = +(new URLSearchParams(location.search).get("v") || 1), desk = innerWidth >= 720;
document.body.classList.add(desk ? "desk" : "phone");
document.getElementById("lab").textContent = `v${v} · ${desk ? "desktop" : "phone"}`;
const K = t => katex.renderToString(t, { throwOnError: false });
const F = [ { id: "WE_THM", g: "Work and Energy", t: "W_{net} = \\Delta K", say: "Net work changes kinetic energy." },
            { id: "KE", g: "Work and Energy", t: "K = \\tfrac12 m v^2", say: "Kinetic energy from speed." },
            { id: "W_AREA", g: "Work and Energy", t: "W = \\text{area under } F\\text{-}x", say: "Work is the signed area." } ];
const SHEET = [ ...F.slice(0, 2), { id: "PE_G", t: "U_g = mgh" }, F[2], { id: "P_AVG", t: "P = W/t" } ];
const question = `<div class="p"><p class="tipl">Add the areas above the axis. Subtract the ones below.</p>
  <p>A ${K("3.0\\ \\text{kg}")} cart moves at ${K("4.0\\ \\text{m/s}")}. The net work on it from the force graph is ${K("12\\ \\text{J}")}. Find its final speed in m/s.</p></div>
  <div class="ff"><span>e.g. 9/2, sqrt(3), dne</span><i></i></div>`;
const cards = {
  1: `<div class="fc v1"><h3>Use these</h3>${F.map(f => `<div class="row"><span class="k">${K(f.t)}</span><span class="g">${f.g}</span></div>`).join("")}</div>`,
  2: `<div class="fc v2"><div class="chips">${F.map((f, i) => `<span class="chip${i ? "" : " on"}">${K(f.t)}</span>`).join("")}</div>
      <div class="open">${K(F[0].t)}<div class="say" style="color:var(--muted);font-size:var(--t-sm);margin-top:var(--s1)">${F[0].say}</div></div></div>`,
  3: desk ? null : `<details class="fc v3" open><summary><span>Formulas (${F.length})</span><span>⌄</span></summary><div class="rows">${F.map(f => `<div class="row">${K(f.t)}</div>`).join("")}</div></details>`,
  4: `<div class="fc v4"><h3>Your sheet: Work and Energy</h3>${SHEET.map((f, i) => `<div class="row${F.some(x => x.id === f.id) ? " use" : ""}"><span class="n">${i + 1}</span>${K(f.t)}</div>`).join("")}</div>`,
  5: `<div class="fc v5"><h3>Do it in this order</h3><ol>${F.slice().reverse().map((f, i, a) => `<li><div>${K(f.t)}<div class="say">${f.say}</div></div></li>${i < a.length - 1 ? '<div class="then">then</div>' : ""}`).join("")}</ol></div>`,
};
const wrap = document.getElementById("wrap");
if (v === 3 && desk) wrap.innerHTML = `<div class="v3wrap"><div>${question}</div><aside class="fc v3"><h3>Use these</h3>${F.map(f => `<div class="row">${K(f.t)}</div>`).join("")}</aside></div>`;
else wrap.innerHTML = question + cards[v];
</script>
</body>
</html>
