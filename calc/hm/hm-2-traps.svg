<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" aria-hidden="true" focusable="false">
<style>
.f{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
*{transform-box:fill-box;transform-origin:center}
.g{animation:g 4s ease-in-out infinite}
.chip{fill:#2d1806;stroke:#ff9a3e;animation:chip 4s ease infinite}
.cn{fill:#ff9a3e;animation:cn 4s ease infinite}
.ln{stroke-dasharray:60;stroke-dashoffset:0;opacity:.5;animation:ln 4s ease-in-out infinite}
.hit{stroke:#ff9a3e;animation:hit 4s ease infinite}
.dim{opacity:.4;animation:dim 4s ease infinite}
.x1,.x2{stroke-dasharray:20;stroke-dashoffset:0;animation:x1 4s ease-in-out infinite}
.x2{animation-name:x2}
@keyframes g{0%{opacity:0}5%,93%{opacity:1}100%{opacity:0}}
@keyframes chip{0%,10%{fill:#1b2b40;stroke:#5e7899}22%,100%{fill:#2d1806;stroke:#ff9a3e}}
@keyframes cn{0%,10%{fill:#f3f7fc}22%,100%{fill:#ff9a3e}}
@keyframes ln{0%,24%{stroke-dashoffset:60;opacity:1}42%{stroke-dashoffset:0;opacity:1}70%,100%{opacity:.5}}
@keyframes hit{0%,38%{stroke:#5e7899}46%,100%{stroke:#ff9a3e}}
@keyframes dim{0%,52%{opacity:1}64%,100%{opacity:.4}}
@keyframes x1{0%,50%{stroke-dashoffset:20}58%,100%{stroke-dashoffset:0}}
@keyframes x2{0%,56%{stroke-dashoffset:20}64%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="g">
<g fill="#394a61">
<rect x="16" y="15" width="40" height="7" rx="3.5"/><rect x="104" y="15" width="34" height="7" rx="3.5"/><rect x="144" y="15" width="40" height="7" rx="3.5"/>
<rect x="16" y="29" width="72" height="7" rx="3.5" opacity=".6"/>
</g>
<rect class="chip" x="62" y="9" width="36" height="19" rx="6" stroke-width="1.5"/>
<text class="f cn" x="80" y="23" font-size="13" text-anchor="middle">48</text>
<path class="ln" d="M76 29C72 50 58 62 50 82" pathLength="60" fill="none" stroke="#ff9a3e" stroke-width="1.5" stroke-linecap="round"/>
<g class="f" font-size="13" fill="#f3f7fc">
<rect x="104" y="46" width="80" height="28" rx="8" fill="#0b1422" stroke="#5e7899"/>
<rect x="16" y="46" width="80" height="28" rx="8" fill="#0b1422" stroke="#5e7899"/>
<rect x="104" y="82" width="80" height="28" rx="8" fill="#0b1422" stroke="#5e7899"/>
<rect class="hit" x="16" y="82" width="80" height="28" rx="8" fill="#0b1422" stroke-width="1.5"/>
<g font-size="9" text-anchor="middle" fill="#a9b8cc">
<circle cx="32" cy="60" r="7.5" fill="none" stroke="#5e7899"/><text x="32" y="63.2">A</text>
<circle cx="120" cy="60" r="7.5" fill="none" stroke="#5e7899"/><text x="120" y="63.2">B</text>
<circle cx="120" cy="96" r="7.5" fill="none" stroke="#5e7899"/><text x="120" y="99.2">D</text>
</g>
<text x="56" y="64.5">24</text><text x="144" y="64.5">12</text><text x="144" y="100.5">96</text>
<g class="dim"><g font-size="9" text-anchor="middle" fill="#a9b8cc"><circle cx="32" cy="96" r="7.5" fill="none" stroke="#5e7899"/><text x="32" y="99.2">C</text></g><text x="56" y="100.5">48</text></g>
</g>
<g stroke="#ff9a3e" stroke-width="2.4" stroke-linecap="round">
<path class="x1" d="M54 89l16 14" pathLength="20"/><path class="x2" d="M70 89l-16 14" pathLength="20"/>
</g>
</g>
</svg>
