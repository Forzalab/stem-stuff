<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" aria-hidden="true" focusable="false">
<style>
.f{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
*{transform-box:fill-box;transform-origin:center}
.g{animation:g 4s ease-in-out infinite}
.ten{animation:ten 4s ease-out infinite}
.mk{animation:mk 4s cubic-bezier(.3,1.4,.5,1) infinite}
.bd{animation:bd 4s ease-out infinite}
.far{opacity:.35;animation:far 4s ease infinite}
.near{animation:near 4s ease infinite}
.st{stroke-dasharray:20;stroke-dashoffset:0;animation:st 4s ease-in-out infinite}
.st2{animation-name:st2}
@keyframes g{0%{opacity:0}5%,93%{opacity:1}100%{opacity:0}}
@keyframes ten{0%,14%{opacity:0;transform:translateX(-10px)}26%,100%{opacity:1;transform:none}}
@keyframes mk{0%,28%{opacity:0;transform:translateY(-16px)}31%{opacity:1}42%,100%{opacity:1;transform:none}}
@keyframes bd{0%,42%{opacity:0;transform:scaleX(.2)}54%,100%{opacity:1;transform:none}}
@keyframes far{0%,54%{opacity:1}66%,100%{opacity:.35}}
@keyframes near{0%,46%{stroke:#a9b8cc}56%,100%{stroke:#ff9a3e}}
@keyframes st{0%,56%{stroke-dashoffset:20}66%,100%{stroke-dashoffset:0}}
@keyframes st2{0%,62%{stroke-dashoffset:20}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="g">
<text class="f" x="54" y="30" font-size="19" fill="#a9b8cc" text-anchor="middle">9.8</text>
<path d="M76 18l6 6-6 6" fill="none" stroke="#5e7899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="f ten" x="104" y="30" font-size="21" fill="#ff9a3e" text-anchor="middle">10</text>
<rect class="bd" x="76" y="82" width="56" height="20" rx="10" fill="#ff9a3e" fill-opacity=".14" stroke="#ff9a3e" stroke-opacity=".45"/>
<path d="M14 92H186" stroke="#5e7899" stroke-width="1.5" stroke-linecap="round"/>
<path d="M30 88v8M65 88v8M100 88v8M135 88v8M170 88v8" stroke="#394a61" stroke-width="1.5"/>
<g class="mk">
<path d="M104 42v34" stroke="#ff9a3e" stroke-width="1.5" stroke-dasharray="2 3"/>
<path d="M97 74h14l-7 9z" fill="#ff9a3e"/>
</g>
<g class="f" font-size="9" text-anchor="middle">
<g class="far"><circle cx="34" cy="92" r="8" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text x="34" y="95.2" fill="#f3f7fc">A</text></g>
<circle class="near" cx="90" cy="92" r="8" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text x="90" y="95.2" fill="#f3f7fc">B</text>
<circle class="near" cx="118" cy="92" r="8" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text x="118" y="95.2" fill="#f3f7fc">C</text>
<g class="far"><circle cx="168" cy="92" r="8" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text x="168" y="95.2" fill="#f3f7fc">D</text></g>
</g>
<path class="st" d="M27 99l14-14" pathLength="20" stroke="#ff9a3e" stroke-width="2.2" stroke-linecap="round"/>
<path class="st st2" d="M161 99l14-14" pathLength="20" stroke="#ff9a3e" stroke-width="2.2" stroke-linecap="round"/>
</g>
</svg>
