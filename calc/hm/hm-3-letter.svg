<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" aria-hidden="true" focusable="false">
<style>
.f{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
*{transform-box:fill-box;transform-origin:center}
.g{animation:g 5s ease-in-out infinite}
.b{transform-origin:bottom;animation:b 5s cubic-bezier(.3,1.3,.5,1) infinite}
.b2{animation-delay:.12s}.b3{animation-delay:.24s}
.gl{opacity:.4;animation:gl 5s ease infinite}
.lc{animation:lc 5s ease infinite}
.pk{animation:pk 5s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes g{0%{opacity:0}4%,94%{opacity:1}100%{opacity:0}}
@keyframes b{0%,8%{transform:scaleY(0)}30%,100%{transform:none}}
@keyframes gl{0%,44%{opacity:0}56%,100%{opacity:.4}}
@keyframes lc{0%,44%{fill:#a9b8cc}56%,100%{fill:#ff9a3e}}
@keyframes pk{0%,62%{transform:scale(0)}74%,100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="g">
<g class="f" font-size="11" fill="#a9b8cc" text-anchor="middle"><text x="40" y="14">A</text><text x="64" y="14">B</text><text x="88" y="14">B</text><text x="112" y="14">D</text><text x="136" y="14">A</text><text x="160" y="14">D</text></g>
<path d="M20 70H180" stroke="#5e7899" stroke-width="1.5" stroke-linecap="round"/>
<rect class="gl" x="86" y="30" width="28" height="40" rx="6" fill="#ff9a3e" filter="url(#bl)"/>
<rect class="b" x="34" y="34" width="22" height="36" rx="4" fill="#5e7899"/>
<rect class="b b2" x="66" y="34" width="22" height="36" rx="4" fill="#5e7899"/>
<rect x="90" y="30" width="20" height="40" rx="4" fill="none" stroke="#ff9a3e" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect class="b b3" x="122" y="34" width="22" height="36" rx="4" fill="#5e7899"/>
<g class="f" font-size="9" fill="#a9b8cc" text-anchor="middle"><text x="45" y="30">2</text><text x="77" y="30">2</text><text class="lc" x="100" y="26">0</text><text x="133" y="30">2</text></g>
<g class="f" font-size="10" text-anchor="middle" fill="#f3f7fc">
<circle cx="45" cy="96" r="10" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text x="45" y="99.5">A</text>
<circle cx="77" cy="96" r="10" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text x="77" y="99.5">B</text>
<circle cx="100" cy="96" r="10" fill="#0b1422" stroke="#ff9a3e" stroke-width="1.5"/><circle class="pk" cx="100" cy="96" r="7.5" fill="#ff9a3e"/><text x="100" y="99.5" fill="#0b1422">C</text>
<circle cx="133" cy="96" r="10" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text x="133" y="99.5">D</text>
</g>
<defs><filter id="bl" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="5"/></filter></defs>
</g>
</svg>
