<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" aria-hidden="true" focusable="false">
<style>
.f{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
*{transform-box:fill-box}
.g{animation:g 4s ease-in-out infinite}
.b{transform-origin:bottom;animation:b 4s cubic-bezier(.3,1.3,.5,1) infinite}
.b2{animation-delay:.12s}.b3{animation-delay:.24s}.b4{animation-delay:.36s}
.lo{fill:#ff9a3e;animation:lo 4s ease infinite}
.gl{opacity:.35;animation:gl 4s ease infinite}
.lc{fill:#ff9a3e;animation:lc 4s ease infinite}
.pk{transform-origin:center;animation:pk 4s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes g{0%{opacity:0}5%,93%{opacity:1}100%{opacity:0}}
@keyframes b{0%,8%{transform:scaleY(0)}30%,100%{transform:none}}
@keyframes lo{0%,44%{fill:#5e7899}54%,100%{fill:#ff9a3e}}
@keyframes gl{0%,44%{opacity:0}54%,100%{opacity:.35}}
@keyframes lc{0%,44%{fill:#a9b8cc}54%,100%{fill:#ff9a3e}}
@keyframes pk{0%,60%{transform:scale(0)}70%,100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="g">
<rect x="12" y="4" width="56" height="112" rx="7" fill="#14233a" stroke="#394a61"/>
<g class="f" font-size="8" fill="#a9b8cc" text-anchor="middle"><text x="25" y="15">A</text><text x="35" y="15">B</text><text x="45" y="15">C</text><text x="55" y="15">D</text></g>
<g fill="none" stroke="#5e7899" stroke-width="1">
<path id="r" d="M22 23a3 3 0 1 0 6 0a3 3 0 1 0-6 0M32 23a3 3 0 1 0 6 0a3 3 0 1 0-6 0M42 23a3 3 0 1 0 6 0a3 3 0 1 0-6 0M52 23a3 3 0 1 0 6 0a3 3 0 1 0-6 0"/>
<use href="#r" y="9"/><use href="#r" y="18"/><use href="#r" y="27"/><use href="#r" y="36"/><use href="#r" y="45"/><use href="#r" y="54"/><use href="#r" y="63"/>
<use href="#r" y="81" stroke="#a9b8cc" stroke-dasharray="2 1.6"/>
</g>
<g fill="#a9b8cc">
<circle cx="25" cy="23" r="3"/><circle cx="35" cy="32" r="3"/><circle cx="55" cy="41" r="3"/><circle cx="35" cy="50" r="3"/>
<circle cx="25" cy="59" r="3"/><circle cx="45" cy="68" r="3"/><circle cx="55" cy="77" r="3"/><circle cx="35" cy="86" r="3"/>
</g>
<path d="M18 95H62" stroke="#394a61" stroke-dasharray="3 2"/>
<circle class="pk" cx="45" cy="104" r="3.6" fill="#ff9a3e"/>
<path d="M90 100H190" stroke="#5e7899" stroke-linecap="round"/>
<rect class="gl" x="139" y="73" width="22" height="31" rx="5" fill="#ff8204" filter="url(#bl)"/>
<rect class="b" x="96" y="56" width="16" height="44" rx="3" fill="#5e7899"/>
<rect class="b b2" x="120" y="34" width="16" height="66" rx="3" fill="#5e7899"/>
<rect class="b b3 lo" x="144" y="78" width="16" height="22" rx="3"/>
<rect class="b b4" x="168" y="56" width="16" height="44" rx="3" fill="#5e7899"/>
<g class="f" font-size="10" fill="#a9b8cc" text-anchor="middle"><text x="104" y="113">A</text><text x="128" y="113">B</text><text class="lc" x="152" y="113">C</text><text x="176" y="113">D</text></g>
<defs><filter id="bl" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="5"/></filter></defs>
</g>
</svg>
