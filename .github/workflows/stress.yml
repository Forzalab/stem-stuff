# CI-LOOSEN AC1.4: stress ONE spec under CPU load. Dispatch only (never on PR/push), e.g. spec=flow n=60.
# LANES run-all.sh processes side by side (like a tests.yml block) + 2 `yes` CPU hogs; each lane runs its share of the n repeats.
# A repeat is bad if it fails OR passes only on the in-job retry (run-all.sh prints `FLAKY <spec>`): n/n clean = pass.
name: stress
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "One .pw spec name as run-all.sh --list prints it"
        default: flow
      n:
        description: "Total repeats (split over 3 lanes)"
        default: "60"
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SPEC: ${{ inputs.spec }}
      N: ${{ inputs.n }}
      LANES: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      - name: playwright install (chromium)
        run: tools/operations/ci-install.sh
      - name: stress
        shell: bash
        run: |
          set -uo pipefail
          [[ "$SPEC" =~ ^[A-Za-z0-9@._-]+$ && "$N" =~ ^[0-9]+$ ]] || { echo "bad input"; exit 2; }
          yes >/dev/null & yes >/dev/null &   # 2 CPU hogs
          per=$(( (N + LANES - 1) / LANES ))
          lane() {   # lane $1: repeats (l-1)*per+1 .. min(l*per, N)
            local l=$1 r
            for r in $(seq 1 "$per"); do
              [ $(( (l - 1) * per + r )) -le "$N" ] || break
              if SPECS="$SPEC" FLAKY_FILE="flaky-$l.txt" tests/run-all.sh >"run-$l-$r.log" 2>&1 && ! grep -q '^FLAKY ' "run-$l-$r.log"; then
                echo "ok $l/$r"
              else
                echo "BAD $l/$r"; cat "run-$l-$r.log"
              fi
            done
          }
          pids=""
          for l in $(seq 1 "$LANES"); do lane "$l" >"lane-$l.out" 2>&1 & pids="$pids $!"; done
          wait $pids
          cat lane-*.out
          ok=$(cat lane-*.out | grep -cE '^ok [0-9]+/[0-9]+$' || true)   # only the lane's own "ok l/r" rows: a BAD repeat's log holds run-all's "ok   <spec> 12.3 s" row when the spec is jailed, and that was counted as clean
          echo "stress $SPEC: $ok/$N clean"
          [ "$ok" -eq "$N" ]
