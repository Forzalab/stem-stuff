# CI-ARCH PR 3 (box detach): the tandem box (titodori-1) hunts flakes in the specs the hosted blocks keep losing, after
# a tests run completes. Never gating: tito is supplementary; continue-on-error, no entry in tests.yml `all.needs`, no
# green stamp, and no `flaky-block-*` artifact (ci-flaky.mjs reads only flaky-block-*), so the box being offline or the
# job being cancelled can never change a tests run or a ship verdict. Result = a per-spec `pass k/5` line in flake-hunt.txt.
name: box
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
  workflow_dispatch:   # manual hunt on the box (no inputs)
# own group: never the tests group, so a hunt never cancels or queues a tests run
concurrency: { group: box, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  # Job B: second opinion on the specs the hosted blocks flagged (or the flaky jail on a manual dispatch).
  # Job B "second opinion" (id flake-hunt kept: ci-gate.test.mjs AC9 + test_ci_image pin it); order B then A
  flake-hunt:
    permissions: { contents: read, actions: read }   # download-artifact of the tests run's flaky-block-* artifacts
    runs-on: [self-hosted, titodori]   # titodori-1: user pwuser (uid 1001), node 22 + python 3.12, no docker.sock
    continue-on-error: true
    timeout-minutes: 20
    # AC9.4 (fork guard): written in this `if` itself, not only implied by the event list. The finished tests run must be a
    # push to main in THIS repo, so fork code never reaches the self-hosted box that keeps its own credentials.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      LANES: 2   # box = 4 vCPU, runner capped at 3 CPUs; never size from nproc (prints 4); runner cap 3 = APPLIED; owui 1 + runner 3
    steps:
      - uses: actions/checkout@v7
        with:
          # the tested commit, never the default branch head
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # no root on the box: the script falls back to a venv when pip cannot write the system python
      # no --with-deps (that needs root): the box's Chromium system libs are expected to be there already
      - name: playwright install (chromium)
        run: tools/operations/ci-install.sh
      # the box has no gh CLI (main run 43898297911: "gh: command not found"): fetch the tests run's flaky blocks with the action
      - name: download flaky-block-*
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: flaky-block-*
          path: flaky
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: hunt
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          specs=""
          if [ -n "${RUN_ID:-}" ]; then
            # the finished tests run's flaky blocks (one flaky-block-* artifact per block/lane shard)
            mkdir -p flaky   # no artifact = empty dir, never a find error under pipefail
            specs="$(find flaky -type f -name flaky.txt -exec cat {} + 2>/dev/null | sed '/^[[:space:]]*$/d' | LC_ALL=C sort -u | paste -sd' ' -)"
            if [ -z "$specs" ]; then
              echo "no flakes in run $RUN_ID" > flake-hunt.txt
              cat flake-hunt.txt
              echo "no flakes in run $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # manual dispatch (no run id): the flaky jail, then the 5 worst from the brain sleep-sweep list
          [ -n "$specs" ] || specs="$(node -e 'const j = require("./tests/quarantine.json"); process.stdout.write((Array.isArray(j) ? j : []).map((e) => e.spec).filter(Boolean).join(" "))')"
          [ -n "$specs" ] || specs="easy flow expr mc-bento bar"
          echo "hunting: $specs"
          : > flake-hunt.txt
          bad=0
          for spec in $specs; do
            pass=0; failed=()
            for k in 1 2 3 4 5; do
              # FLAKY_FILE per run: never the block job's flaky.txt (a spec that flakes here is counted as a miss, which is the point)
              if SPECS="$spec" FLAKY_FILE="hunt-$spec-$k.flaky" tests/run-all.sh > "hunt-$spec-$k.log" 2>&1; then
                pass=$((pass + 1))
              else
                failed+=("$k")
              fi
            done
            echo "$spec pass $pass/5" | tee -a flake-hunt.txt
            [ "$pass" -eq 5 ] && continue
            bad=1
            for k in "${failed[@]}"; do
              echo "  $spec run $k: $(grep -E '^(FAIL|FLAKY|NOT COVERED)' "hunt-$spec-$k.log" | head -5 | paste -sd'; ' -)" >> flake-hunt.txt
            done
          done
          echo; cat flake-hunt.txt
          { echo "## second opinion (flake-hunt)"; cat flake-hunt.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit "$bad"
      - name: upload flake-hunt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-hunt   # never named flaky-block-*: the `all` job downloads only that pattern (AC9.5)
          path: flake-hunt.txt
          if-no-files-found: ignore
          retention-days: 7
  # Job A: the quiet lane. Runs after Job B (never in parallel with it): the wall-clock specs measure real time, so they need
  # the box to themselves. LANES: 1 is the point; never size from nproc. If this lane takes >15 min, split
  # tests/wallclock.json across jobs instead of raising the 20 min timeout.
  quiet-lane:
    needs: flake-hunt
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, titodori]
    continue-on-error: true
    timeout-minutes: 20
    env:
      LANES: 1   # quiet is the point; never nproc
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the tested commit, never the default branch head
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # no root on the box: the script falls back to a venv when pip cannot write the system python
      # no --with-deps (that needs root): the box's Chromium system libs are expected to be there already
      - name: playwright install (chromium)
        run: tools/operations/ci-install.sh
      - name: quiet lane
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          # the quiet-lane list is tests/wallclock.json; WALLCLOCK_RUN=1 tells run-all.sh not to skip it
          SPECS="$(node -p 'require("./tests/wallclock.json").join(" ")')" WALLCLOCK_RUN=1 tests/run-all.sh > quiet.log 2>&1 || rc=$?
          tail -n 40 quiet.log
          { echo "quiet-lane $SHA $( [ "$rc" -eq 0 ] && echo PASS || echo FAIL )"; grep -E '^(FAIL|FLAKY) ' quiet.log || true; } > quiet-lane.txt
          cat quiet-lane.txt
          { echo "## quiet-lane"; cat quiet-lane.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: upload quiet-lane
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-lane
          path: |
            quiet-lane.txt
            quiet.log
          if-no-files-found: ignore
          retention-days: 7
