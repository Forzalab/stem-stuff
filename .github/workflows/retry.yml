# R4 (ticket 09, PR 4): auto-rerun a tests.yml run that failed on its FIRST attempt, once. A pass that
# only happens on attempt >= 2 is YELLOW: tools/operations/batch.sh renders it yellow and the ship gate refuses it
# (tools/operations/ci-retry.mjs attemptColor, imported by tools/operations/ci-gate.mjs pickGreen). Never retry a run twice.
# W4: test failures are retried inside the job (tests/run-all.sh run(), FLAKY <spec>); this reruns INFRA failures only (runner died,
# npm ci / browser install failed): a failed job whose log holds a `FAIL <spec>` line is NOT rerun.
# The decision is the pure, tested shouldRetry; this workflow only wires the GitHub events to it.
name: retry
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
permissions:
  contents: read    # actions/checkout reads this repo for the pure decision module
  actions: write    # reads the failed jobs' logs + POST /rerun-failed-jobs on the failed run
jobs:
  retry:
    # R4 guards: never retry a dispatch (bench/mutant or fast pipe), a fork PR, or a non-first attempt.
    # shouldRetry stays the main rule; attempt == 1 is a second guard so an odd/missing attempt can never loop.
    if: >-
      github.event.workflow_run.event != 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - id: d
        shell: bash
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          : >failed.log; FAILED_JOBS=0   # the logs of the failed jobs: a `FAIL <spec>` line in them = a test failure (retried in-job already)
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .id'); do
            FAILED_JOBS=$((FAILED_JOBS + 1))
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" >>failed.log || true
          done
          FAILED_JOBS="$FAILED_JOBS" CONCLUSION="$CONCLUSION" RUN_ATTEMPT="$RUN_ATTEMPT" node --input-type=module -e '
            import { shouldRetry, attemptColor } from "./tools/operations/ci-retry.mjs";
            const run = { conclusion: process.env.CONCLUSION, run_attempt: Number(process.env.RUN_ATTEMPT) };
            const log = (await import("node:fs")).readFileSync("failed.log", "utf8");
            console.error(`retry: attempt ${process.env.RUN_ATTEMPT} ${process.env.CONCLUSION} -> ${attemptColor(run)}; failedJobs=${process.env.FAILED_JOBS}; shouldRetry=${shouldRetry(run, log, Number(process.env.FAILED_JOBS))}`);
            process.stdout.write(shouldRetry(run, log, Number(process.env.FAILED_JOBS)) ? "true" : "false");
          ' > retry.txt
          echo "retry=$(cat retry.txt)" >> "$GITHUB_OUTPUT"
      - if: steps.d.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # a 403 "cannot be retried" (0-job / workflow-file-error run, already-retried run) is a clean no-op, not a red retry run
          if ! out=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs" 2>&1); then
            if grep -q "cannot be retried" <<<"$out"; then echo "retry: run $RUN_ID cannot be retried (HTTP 403), no-op"; exit 0; fi
            echo "$out"; exit 1
          fi
