# The power button: tools/build_and_ship/ship.sh demo|live on a GitHub runner, so a slow network only has to send one tiny request.
# Phone: GitHub app → Actions → ship → Run workflow, or the curl in docs/design/DEPLOY.md ("Power button"). Runs ship.sh unchanged:
# origin/main + the brain banks (bank hatch) → Vercel → smoke. Banks live only in ship.sh's temp dirs on this throwaway runner:
# no artifacts, no caches (banks never land on GitHub).
name: ship
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo = private preview URL, live = stem-stuff.vercel.app"
        type: choice
        options: [demo, live]
        default: demo
        required: true
      pins:
        description: "bank pins, e.g. BANK_P3X@cd581738 (comma-separated). Empty = the repo variable SHIP_PINS, else every bank at brain main"
        type: string
        default: ""
        required: false
permissions:
  contents: read
  actions: read   # the ship gate reads tests.yml run conclusions (no secret of its own)
concurrency: { group: ship, cancel-in-progress: false }
jobs:
  ship:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: { shell: bash }   # -eo pipefail (the default shell has no pipefail)
    steps:
      - name: Check secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRAIN_TOKEN: ${{ secrets.BRAIN_TOKEN }}
        run: |
          miss=
          [ -n "$VERCEL_TOKEN" ] || miss="$miss VERCEL_TOKEN"
          [ -n "$BRAIN_TOKEN" ] || miss="$miss BRAIN_TOKEN"
          if [ -n "$miss" ]; then
            echo "::error::missing repo secret(s):$miss. Settings → Secrets and variables → Actions (docs/design/DEPLOY.md, Power button)"
            exit 1
          fi
      # ref main: ship.sh deploys origin/main and stops if its own copy differs from main's. fetch-depth 0: version.sh reads the
      # first-parent history for the PR number ("#83+1"); a shallow clone would stamp "?".
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      # the bank gate (tools/build_and_ship/ship.sh, #261) runs slips.py --strict (sympy) and the schema check (tests/node_modules): no deps = nothing deployed
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sympy
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      - run: cd tests && npm ci
      # the figure PNG gate (tools/bank_tools/fig_png.mjs --root, todo 134) draws the brain banks' figures: Chromium for playwright-core (no
      # --with-deps: ubuntu-24.04 has its libs, see tests.yml) + ImageMagick's convert (installed only if the image lacks it)
      - run: cd tests && npx playwright-core install --only-shell chromium
      - run: command -v convert >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q imagemagick; }
      # ship.sh runs every Vercel command as `npx -y vercel@latest`: warm that cache once (and log the version)
      - run: npx -y vercel@latest --version
      # The ship gate (ticket 09, PR 1). Facts only, no new secret: main push runs today are all FULL (tests.yml push: [main]).
      # Query tests.yml's own runs (the per-workflow endpoint): a green ship/prune/spend run is not a green test run.
      # tools/operations/ci-gate.mjs refuses (exit 1) unless origin/main itself, or a docs-only diff after it, has a full green run; the
      # step sits BEFORE tools/build_and_ship/ship.sh so a refusal happens before any Vercel call.
      - name: fetch main test runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # event=push + event=schedule are LOAD-BEARING: a batch landing push and the nightly schedule are the only
          # FULL runs on main. The runs API has no `inputs`, so ci-gate runKind would read every dispatch (fast/bench)
          # run as full. Never add workflow_dispatch (inputs absent) or pull_request (affected, never a ship run).
          {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?branch=main&event=push&per_page=100" \
              --jq '[.workflow_runs[] | {head_sha, conclusion, event, status, created_at, head_branch, run_attempt}]'
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?branch=main&event=schedule&per_page=100" \
              --jq '[.workflow_runs[] | {head_sha, conclusion, event, status, created_at, head_branch, run_attempt}]'
          } | jq -s 'add' > runs.json
      - name: ship gate (full green on origin/main)
        run: |
          CANDIDATE="$(git rev-parse origin/main)"
          echo "ship gate: candidate $CANDIDATE"
          node tools/operations/ci-gate.mjs --candidate "$CANDIDATE" --runs runs.json
      - name: tools/build_and_ship/ship.sh
        env:
          MODE: ${{ inputs.mode }}
          SHIP_PINS: ${{ inputs.pins || vars.SHIP_PINS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRAIN_TOKEN: ${{ secrets.BRAIN_TOKEN }}
        run: |
          case "$MODE" in demo|live) ;; *) echo "::error::mode must be demo or live"; exit 2 ;; esac
          tools/build_and_ship/ship.sh "$MODE"
