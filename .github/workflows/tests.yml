# Every PR and every push to main: the whole suite (tests/run-all.sh). Red here = nobody needs to open a chat to know.
name: tests
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * *"   # nightly full suite on main (02:30 PT / 09:30 UTC): the drift backstop once a batch moves main once (R3)
  workflow_dispatch:   # CI bench (brain _files/ci-plan-2026-10-23/arch-research-E-bench.md): run a bench/* branch, optionally with a seeded fault
    inputs:
      mutant:
        description: "Fault to seed: applies tests/bench/mutants/<name>.patch from the run's branch (empty = none)"
        default: ""
      manifest:
        description: "Batch number when fired by tools/batch.sh on batch/<n> (empty = none)"
        default: ""
      pipe:
        description: "full = whole suite; fast = tests/run-all.sh --fast only (ticket 07 timing)"
        type: choice
        options: [full, fast]
        default: full
# M5 (ticket 09, PR 5): a new PR push must NOT cancel the full run still going for its old commit; the decide job
# below sends it down the fast pipe instead. A PR run therefore gets its own per-run concurrency group (no cancellation,
# no pending-run replacement); main/schedule/dispatch queue every run in order (max), so 3 quick merges left the middle
# one untested before and must not again.
concurrency:
  group: tests-${{ github.ref }}${{ github.event_name == 'pull_request' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false
  queue: max
env:
  BLOCKS: 4   # runners for the .pw specs (GitHub Free: 20 jobs at once)
  LANES: 3    # run-all.sh processes per runner (Tony's pick, CI plan PR 10): bench B 4x3 vs 5x2 = wall -23 s, runner-min -26%. The 3-lane flow.pw flakes were view transitions eating raw input (todo 55, #302)
jobs:
  decide:   # M5: fast pipe only when a full run for this same PR is already queued/in_progress; never fast for push/schedule/dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read, actions: read }
    outputs:
      pipe: ${{ steps.d.outputs.pipe }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}   # the PR head, not github.sha (the merge ref)
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          in_flight=false
          if [ "$EVENT" = pull_request ]; then
            n="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?event=pull_request&per_page=100" \
              | jq --arg ref "$HEAD_REF" --arg sha "$HEAD_SHA" --argjson rid "$RUN_ID" \
              '[.workflow_runs[] | select(.head_branch == $ref) | select(.head_sha != $sha) | select(.id < $rid)
                | select(.status == "queued" or .status == "in_progress")] | length')"
            [ "$n" -eq 0 ] || in_flight=true
          fi
          IN_FLIGHT="$in_flight" node --input-type=module -e '
            import { decidePipe } from "./tools/ci-pipe.mjs";
            const d = decidePipe({ event: process.env.EVENT, inFlight: process.env.IN_FLIGHT === "true" });
            console.error(`decidePipe: ${d.pipe} (${d.reason})`);
            process.stdout.write(d.pipe);
          ' > pipe.txt
          echo "pipe=$(cat pipe.txt)" >> "$GITHUB_OUTPUT"
  plan:   # ~10 s: the matrix only (tests/run-all.sh --plan: the same weight() deal as SHARD, so local and CI agree)
    needs: decide
    if: inputs.pipe != 'fast' && needs.decide.outputs.pipe != 'fast'   # empty on push/pull_request, so those still run; block follows via needs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      skip_block: ${{ steps.p.outputs.skip_block }}
      docs_only: ${{ steps.p.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the PR base sha must be in history for the selection diff
      - id: p
        shell: bash
        run: |
          set -euo pipefail
          total="$(tests/run-all.sh --list | wc -l)"
          files=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t files < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          fi
          args=()
          for f in "${files[@]}"; do args+=(--file "$f"); done
          selection="$(node tools/ci-select.mjs --total "$total" "${args[@]}")"
          read -r kind reason <<<"$selection"
          echo "selection: $kind ($reason)"
          specs=""; skip=false
          if [ "$kind" = "affected" ]; then   # consume run-all.sh --affected (06); split logic units from .pw names
            mapfile -t units < <(tests/run-all.sh --affected "${files[@]}" | grep -v '^unmapped:' || true)
            specs="$(printf '%s\n' "${units[@]}" | grep -vxE 'unittest|npm' | paste -sd' ' - || true)"
            [ -n "$specs" ] || skip=true   # zero .pw: an empty SPECS would plan ALL, so skip block instead (§5)
          fi
          matrix="$(SPECS="$specs" tests/run-all.sh --plan "$BLOCKS" "$LANES")"
          echo "skip_block=$skip" >> "$GITHUB_OUTPUT"
          echo "docs_only=$([ "$kind" = docs ] && echo true || echo false)" >> "$GITHUB_OUTPUT"   # docs-only PR: unit + block skip
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  unit:   # unittest + npm (no browser), next to the blocks so they add no wall-clock
    needs: [decide, plan]
    if: inputs.pipe != 'fast' && needs.decide.outputs.pipe != 'fast' && needs.plan.outputs.docs_only != 'true'   # docs-only PR: skipped
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - if: inputs.mutant   # bench only: seed the fault this run must catch
        env: { MUTANT: "${{ inputs.mutant }}" }
        run: git apply "tests/bench/mutants/$MUTANT.patch"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install sympy networkx
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      - run: cd tests && npm ci
      - run: tests/run-all.sh --quick
      - run: node --test tests/invariants.slow.mjs   # ~50 s whole-repo invariant loops (tests/INVARIANTS.md); kept out of npm test so --fast/--quick stay fast
  block:   # one runner: LANES run-all.sh processes side by side, each with its own lane of specs, server and port
    needs: [decide, plan]
    if: needs.decide.outputs.pipe != 'fast' && needs.plan.outputs.skip_block != 'true' && needs.plan.outputs.docs_only != 'true'   # zero-.pw affected PR: no block work (unit still runs)
    # pinned, never ubuntu-latest: it rolled to 26.04 and Playwright 1.56.1 has no browsers there (PR #337 run 40950644957).
    # Moving off 24.04 = a Playwright bump first (todo 80). Guard: tests/test_ci_image.py
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: block ${{ matrix.block }}/${{ matrix.of }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.mutant   # bench only: seed the fault this run must catch
        env: { MUTANT: "${{ inputs.mutant }}" }
        run: git apply "tests/bench/mutants/$MUTANT.patch"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install sympy networkx
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      # the .pw scripts require("playwright"); tests/package.json pins only playwright-core, so add the same version here
      - run: |
          cd tests && npm ci
          npm i --no-save "playwright@$(node -p "require('playwright-core/package.json').version")"
          # no --with-deps: ubuntu-24.04 already has Chromium's system libs. Bench run 39915938764: 25 s vs 37 s, and no apt tail (old installs hit 345-514 s)
          npx playwright install --only-shell chromium
      - name: lanes
        env:
          LANE_SPECS: ${{ matrix.lanes }}
        run: |
          IFS='|' read -ra lane <<<"$LANE_SPECS"
          for i in "${!lane[@]}"; do SPECS="${lane[$i]}" tests/run-all.sh >"lane-$((i + 1)).log" 2>&1 & pid[$i]=$!; done
          rc=0
          for i in "${!lane[@]}"; do
            wait "${pid[$i]}" || rc=1
            echo "::group::lane $((i + 1)): ${lane[$i]}"; cat "lane-$((i + 1)).log"; echo "::endgroup::"
            grep -E '^(FAIL|NOT COVERED)|FAILED' "lane-$((i + 1)).log" | sed "s/^/lane $((i + 1)): /" || true
          done
          exit "$rc"
  fast:   # ticket 07 timing: dispatch with pipe=fast, or a PR push while its full run is in flight (M5), runs only run-all.sh --fast
    needs: decide
    if: inputs.pipe == 'fast' || needs.decide.outputs.pipe == 'fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install sympy networkx
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      - run: |
          cd tests && npm ci
          npm i --no-save "playwright@$(node -p "require('playwright-core/package.json').version")"
          npx playwright install --only-shell chromium
      - shell: bash   # explicit shell = pipefail, so tee keeps run-all's exit code
        run: tests/run-all.sh --fast 2>&1 | tee fast.log
      - if: always()
        run: grep 'fast total' fast.log >>"$GITHUB_STEP_SUMMARY" || true
  # the one required check: branch protection wants a check named exactly `all`; green only if plan, unit and every block are
  all:
    needs: [decide, plan, unit, block]
    if: always() && inputs.pipe != 'fast' && needs.decide.outputs.pipe != 'fast'
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.decide.result }}" = success && test "${{ needs.plan.result }}" = success && (test "${{ needs.unit.result }}" = success || test "${{ needs.unit.result }}" = skipped) && (test "${{ needs.block.result }}" = success || test "${{ needs.block.result }}" = skipped)
  # bench only: one CSV of this run's job times (queue wait apart from run time) and per-spec seconds from the lane logs
  bench:
    needs: [plan, unit, block]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pipe != 'fast'
    runs-on: ubuntu-24.04
    permissions: { actions: read }
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.run_id }}/${{ github.run_attempt }}
      TAG: ${{ github.run_id }},${{ github.run_attempt }},${{ github.sha }},${{ inputs.mutant }}
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/${RUN%/*}/attempts/${RUN#*/}/jobs?per_page=50" >jobs.json
          echo "run,attempt,sha,mutant,job,conclusion,queue_s,run_s" >jobs.csv
          jq -r --arg t "$TAG" '.jobs[] | select(.name != "bench" and .completed_at != null)
            | [$t, .name, .conclusion, ((.started_at|fromdate) - (.created_at|fromdate)), ((.completed_at|fromdate) - (.started_at|fromdate))] | @csv' jobs.json | tr -d '"' >>jobs.csv
          echo "run,attempt,sha,mutant,job,lane,spec,result,s" >specs.csv
          jq -r '.jobs[] | select(.name | startswith("block ")) | "\(.id) \(.name)"' jobs.json | while read -r id name; do
            # curl, not gh api: gh refuses to print a log that holds terminal escape codes (run 40151630168: 0 spec rows)
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" | sed 's/^[^ ]* //' |
              awk -v t="$TAG" -v j="$name" '/^##\[group\]lane [0-9]+:/ { split($2, a, ":"); lane = a[1] } lane && /^(ok|FAIL) +[^ ]+ [0-9.]+ s$/ { print t "," j "," lane "," $2 "," $1 "," $3 }' >>specs.csv
          done
          { echo '```'; cat jobs.csv; echo; cat specs.csv; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          cat jobs.csv specs.csv
          test "$(wc -l <specs.csv)" -gt 1 || { echo "::error::no spec rows read from the block logs"; exit 1; }
