# Every PR and every push to main: the whole suite (tests/run-all.sh). Red here = nobody needs to open a chat to know.
name: tests
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]   # live-ok: a label change must re-run the verdict (VISUAL-PR GATE)
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * *"   # nightly full suite on main (02:30 PT / 09:30 UTC): the drift backstop once a batch moves main once (R3)
  workflow_dispatch:   # CI bench (brain _files/ci-plan-2026-10-23/arch-research-E-bench.md): run a bench/* branch, optionally with a seeded fault
    inputs:
      mutant:
        description: "Fault to seed: applies tests/bench/mutants/<name>.patch from the run's branch (empty = none)"
        default: ""
      manifest:
        description: "Batch number when fired by tools/operations/batch.sh on batch/<n> (empty = none)"
        default: ""
      pipe:
        description: "full = whole suite; fast = tests/run-all.sh --fast only (ticket 07 timing)"
        type: choice
        options: [full, fast]
        default: full
# M5 (ticket 09, PR 5): a new PR push must NOT cancel the full run still going for its old commit; the decide job
# below sends it down the fast pipe instead. A PR run therefore gets its own per-run concurrency group (no cancellation,
# no pending-run replacement); main/schedule/dispatch queue every run in order (max), so 3 quick merges left the middle
# one untested before and must not again.
# orc14 (decision 13a + all-never-skipped): a PR push now CANCELS the run for its old head and runs the full pipe on the
# new head (newest wins). The old M5 fast pipe left the new head without a full run, so with `all` red on fast-only heads
# a PR with a mid-CI push could never merge. main/schedule/dispatch still queue every run in order (max).
concurrency:
  # CI-ARCH PR 3: push = per-sha group, main runs in parallel; PR rule unchanged.
  group: tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  # queue: max cannot be combined with cancel-in-progress: true (every PR run died at startup, 0 jobs, since #589).
  # PRs: newest wins (default queue). main/schedule/dispatch: no cancel, queue every run in order.
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}
env:
  BLOCKS: 4   # runners for the .pw specs (GitHub Free: 20 jobs at once)
  LANES: 3    # run-all.sh processes per runner (Tony's pick, CI plan PR 10): bench B 4x3 vs 5x2 = wall -23 s, runner-min -26%. The 3-lane flow.pw flakes were view transitions eating raw input (todo 55, #302)
jobs:
  decide:   # M5: fast pipe only when a full run for this same PR is already queued/in_progress; never fast for push/schedule/dispatch
    # TODO 20: only a pull_request has anything to decide, so this job is skipped on push/schedule/workflow_dispatch (~15 s off each).
    # Its result is then `skipped`: every job below that needs it accepts skipped, and `all` counts it as ok (ci-all-verdict.sh).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read, actions: read }
    outputs:
      pipe: ${{ steps.d.outputs.pipe }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}   # the PR head, not github.sha (the merge ref)
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          in_flight=false
          if false && [ "$EVENT" = pull_request ]; then   # orc14: PR runs are newest-wins (concurrency above), never fast
            n="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?event=pull_request&per_page=100" \
              | jq --arg ref "$HEAD_REF" --arg sha "$HEAD_SHA" --argjson rid "$RUN_ID" \
              '[.workflow_runs[] | select(.head_branch == $ref) | select(.head_sha != $sha) | select(.id < $rid)
                | select(.status == "queued" or .status == "in_progress")] | length')"
            [ "$n" -eq 0 ] || in_flight=true
          fi
          IN_FLIGHT="$in_flight" node --input-type=module -e '
            import { decidePipe } from "./tools/operations/ci-pipe.mjs";
            const d = decidePipe({ event: process.env.EVENT, inFlight: process.env.IN_FLIGHT === "true" });
            console.error(`decidePipe: ${d.pipe} (${d.reason})`);
            process.stdout.write(d.pipe);
          ' > pipe.txt
          echo "pipe=$(cat pipe.txt)" >> "$GITHUB_OUTPUT"
  plan:   # ~10 s: the matrix only (tests/run-all.sh --plan: the same weight() deal as SHARD, so local and CI agree)
    needs: decide
    # TODO 20: decide is skipped on push/schedule/dispatch, so its result may be `skipped`; !cancelled() (a status
    # function) also stops GitHub adding the implicit success(), which would skip this job when decide was skipped.
    if: (needs.decide.result == 'success' || needs.decide.result == 'skipped') && !cancelled() && inputs.pipe != 'fast' && needs.decide.outputs.pipe != 'fast'   # empty on push/pull_request, so those still run; block follows via needs
    runs-on: ubuntu-24.04
    permissions: { contents: read, actions: read }   # stamp-find reads artifacts + runs (SHIP_MODE pr-green)
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      skip_block: ${{ steps.p.outputs.skip_block }}
      docs_only: ${{ steps.p.outputs.docs_only }}
      kind: ${{ steps.p.outputs.kind }}
      stamped: ${{ steps.p.outputs.stamped }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # the PR base sha must be in history for the selection diff
      - id: p
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_MODE: ${{ vars.SHIP_MODE }}
        run: |
          set -euo pipefail
          total="$(tests/run-all.sh --list | wc -l)"
          files=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t files < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          fi
          args=()
          for f in "${files[@]}"; do args+=(--file "$f"); done
          selection="$(node tools/operations/ci-select.mjs --total "$total" "${args[@]}")"
          read -r kind reason <<<"$selection"
          echo "selection: $kind ($reason)"
          specs=""; skip=false
          if [ "$kind" = bank ]; then skip=true; fi   # CI-LOOSEN 17: bank JSON only -> unit (bankcheck) runs, block skipped
          if [ "$kind" = "affected" ]; then   # consume run-all.sh --affected (06); split logic units from .pw names
            mapfile -t units < <(tests/run-all.sh --affected "${files[@]}" | grep -v '^unmapped:' || true)
            specs="$(printf '%s\n' "${units[@]}" | grep -vxE 'unittest|npm' | paste -sd' ' - || true)"
            [ -n "$specs" ] || skip=true   # zero .pw: an empty SPECS would plan ALL, so skip block instead (§5)
          fi
          matrix="$(SPECS="$specs" tests/run-all.sh --plan "$BLOCKS" "$LANES")"
          # SHIP_MODE pr-green (P4): a push to main whose tree already has a FULL green stamp from a same-repo PR run needs no duplicate full run
          stamped=false
          if [ "${{ github.event_name }}" = push ] && [ "${SHIP_MODE:-strict}" = pr-green ]; then
            node tools/operations/ci-ship.mjs stamp-find "$(git rev-parse 'HEAD^{tree}')" stamps.json
            stamped="$(TREE="$(git rev-parse 'HEAD^{tree}')" node --input-type=module -e '
              import { decideStamp } from "./tools/operations/ci-ship.mjs";
              import { readFileSync } from "node:fs";
              const jail = (() => { try { return JSON.parse(readFileSync("tests/quarantine.json", "utf8")); } catch { return []; } })();
              const d = decideStamp({ tree: process.env.TREE, entries: JSON.parse(readFileSync("stamps.json", "utf8")), repo: process.env.GITHUB_REPOSITORY, jail });
              console.error(`stamp: ${d.reason}`);
              process.stdout.write(d.ok && d.kind === "full" && d.source === "pull_request" ? "true" : "false");
            ')"
          fi
          echo "stamped=$stamped" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "skip_block=$skip" >> "$GITHUB_OUTPUT"
          echo "docs_only=$([ "$kind" = docs ] && echo true || echo false)" >> "$GITHUB_OUTPUT"   # docs-only PR: unit + block skip
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  unit:   # unittest + npm (no browser), next to the blocks so they add no wall-clock
    needs: [decide, plan]
    if: (needs.decide.result == 'success' || needs.decide.result == 'skipped') && needs.plan.result == 'success' && !cancelled() && inputs.pipe != 'fast' && needs.decide.outputs.pipe != 'fast' && needs.plan.outputs.docs_only != 'true' && needs.plan.outputs.stamped != 'true'   # docs-only PR: skipped; stamped push (P4): the PR run already ran this tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - if: inputs.mutant   # bench only: seed the fault this run must catch
        env: { MUTANT: "${{ inputs.mutant }}" }
        run: git apply "tests/bench/mutants/$MUTANT.patch"
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      - run: tools/operations/ci-install.sh --no-browser   # requirements.txt pins + npm ci; no .pw spec runs in this job
      - run: tests/run-all.sh --quick
      - run: node --test tests/invariants.slow.mjs   # ~50 s whole-repo invariant loops (tests/INVARIANTS.md); kept out of npm test so --fast/--quick stay fast
      - run: node tools/operations/sleep-ratchet.mjs   # AC2.5: no spec may gain a waitForTimeout( above tests/sleep-baseline.json
  block:   # one runner: LANES run-all.sh processes side by side, each with its own lane of specs, server and port
    needs: [decide, plan]
    if: (needs.decide.result == 'success' || needs.decide.result == 'skipped') && needs.plan.result == 'success' && !cancelled() && needs.decide.outputs.pipe != 'fast' && needs.plan.outputs.skip_block != 'true' && needs.plan.outputs.docs_only != 'true' && needs.plan.outputs.stamped != 'true'   # zero-.pw affected PR: no block work (unit still runs); stamped push (P4): the PR run already ran this tree
    # pinned, never ubuntu-latest: it rolled to 26.04 and Playwright 1.56.1 has no browsers there (PR #337 run 40950644957).
    # Moving off 24.04 = a Playwright bump first (todo 80). Guard: tests/test_ci_image.py
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: block ${{ matrix.block }}/${{ matrix.of }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - if: inputs.mutant   # bench only: seed the fault this run must catch
        env: { MUTANT: "${{ inputs.mutant }}" }
        run: git apply "tests/bench/mutants/$MUTANT.patch"
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      # no --with-deps: ubuntu-24.04 already has Chromium's system libs. Bench run 39915938764: 25 s vs 37 s, and no apt tail (old installs hit 345-514 s)
      - name: playwright install (chromium)
        run: tools/operations/ci-install.sh
      - name: lanes
        id: lanes
        env:
          LANE_SPECS: ${{ matrix.lanes }}
          DIFF_DIR: ${{ github.workspace }}/jank-diff   # specs that diff screenshots (desk-layout) keep shots + *-DIFF.png here
          # CI-ARCH PR 1 (Tony L1): a retry-pass on a main push = GREEN + ticket; on a PR only with SHIP_MODE pr-green (Nov 15)
          FLAKY_PASS: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && vars.SHIP_MODE == 'pr-green')) && '1' || '' }}
        run: |
          IFS='|' read -ra lane <<<"$LANE_SPECS"
          : >flaky.txt   # W4: always exists in a block that ran; each lane appends the specs that failed once and passed on retry
          mkdir -p logs
          # CI-FLAKE-LOGS: each lane keeps its spec logs + serve.log (+ each *.try1.log) in logs/lane-N/ for the upload below
          for i in "${!lane[@]}"; do SPECS="${lane[$i]}" FLAKY_FILE="flaky-$((i + 1)).txt" LOG_DIR="logs/lane-$((i + 1))" tests/run-all.sh >"lane-$((i + 1)).log" 2>&1 & pid[$i]=$!; done
          rc=0
          for i in "${!lane[@]}"; do
            wait "${pid[$i]}" || rc=1
            cat "flaky-$((i + 1)).txt" >>flaky.txt 2>/dev/null || true
            echo "::group::lane $((i + 1)): ${lane[$i]}"; cat "lane-$((i + 1)).log"; echo "::endgroup::"
            grep -E '^(FAIL|NOT COVERED)|FAILED' "lane-$((i + 1)).log" | sed "s/^/lane $((i + 1)): /" || true
          done
          cp lane-*.log logs/ 2>/dev/null || true   # the lane stdout logs too, next to each lane's spec logs
          # CI-FLAKE-LOGS: flaky.txt always exists, so it can never gate the upload; a red lane or a real flake line can
          if [ -s flaky.txt ] || [ "$rc" -ne 0 ]; then echo "has_logs=true" >>"$GITHUB_OUTPUT"; fi
          exit "$rc"
      - name: upload flaky list   # W4: the `all` job reads it (FLAKY <spec> lines, one spec per line)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-block-${{ matrix.block }}
          path: flaky.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: upload lane logs   # CI-FLAKE-LOGS: the lane logs die with the runner otherwise
        if: always() && steps.lanes.outputs.has_logs == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: logs-block-${{ matrix.block }}
          path: logs
          if-no-files-found: ignore
          retention-days: 7
      - name: upload jank diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jank-diff-block-${{ matrix.block }}
          path: jank-diff
          if-no-files-found: ignore
          retention-days: 7
  fast:   # ticket 07 timing: dispatch with pipe=fast, or a PR push while its full run is in flight (M5), runs only run-all.sh --fast
    needs: decide
    if: (needs.decide.result == 'success' || needs.decide.result == 'skipped') && !cancelled() && (inputs.pipe == 'fast' || needs.decide.outputs.pipe == 'fast')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      - name: playwright install (chromium)
        run: tools/operations/ci-install.sh
      - shell: bash   # explicit shell = pipefail, so tee keeps run-all's exit code
        run: tests/run-all.sh --fast 2>&1 | tee fast.log
      - if: always()
        run: grep 'fast total' fast.log >>"$GITHUB_STEP_SUMMARY" || true
  webkit:   # WEBKIT-CI (G6.1): ~60% of users are on iPhone, CI is Chromium. PRs that touch client CSS/JS also run a few iPhone-risk specs on WebKit.
    # Not in `all` yet (report-only until it has a green history); PR events only. No grid probe exists in tests/ yet: add it to WK_SPECS when it lands.
    needs: decide
    if: (needs.decide.result == 'success' || needs.decide.result == 'skipped') && !cancelled() && github.event_name == 'pull_request' && needs.decide.outputs.pipe != 'fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WK_SPECS: proof-kb nav-stable toast-calc progbar-baseline desk-layout@1   # keyboard/inputs, nav, toast, progbar-baseline, layout
      WK_FALLBACK_SPECS: proof-kb desk-layout@1                                 # inputs + layout with no text-box-trim / field-sizing
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          n="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -cE '^(client/|index\.html$|sw\.js$|tests/pw-browser\.mjs$|tests/lib/wait\.mjs$)' || true)"
          echo "client files changed: $n"
          echo "run=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      - if: steps.scope.outputs.run == 'true'
        name: playwright install (webkit, --with-deps)
        run: tools/operations/ci-install.sh --with-deps --browser webkit
      - name: webkit specs
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env: { PW_BROWSER: webkit, ENGINES: webkit }   # ENGINES: desk-layout's own engine list
        run: SPECS="$WK_SPECS" tests/run-all.sh 2>&1 | tee wk.log
      - name: webkit specs, text-box-trim / field-sizing forced off
        if: steps.scope.outputs.run == 'true' && !cancelled()
        shell: bash
        env: { PW_BROWSER: webkit, ENGINES: webkit, PW_FORCE_FALLBACK: "1" }
        run: SPECS="$WK_FALLBACK_SPECS" tests/run-all.sh 2>&1 | tee wk-fallback.log
  live-ok:   # VISUAL-PR GATE (Tony Nov 27): a PR needs label nonvisual, or visual + the tony-cleared label; pull_request only (skipped elsewhere, `all` accepts that)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: { pull-requests: read, contents: read }
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: LABELS="$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')" tools/operations/ci-live-ok.sh   # fresh read: a re-run must see current labels
  # the one required check: branch protection wants a check named exactly `all`; green only if plan, unit and every block are
  # AC0.2: never skipped (`if: always()`, every pipe). Fast pipe = red "fast pipe only"; skips only for docs-only / zero-.pw (tools/operations/ci-all-verdict.sh)
  all:
    needs: [decide, plan, unit, block, live-ok]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      tickets: ${{ steps.fl.outputs.tickets }}
    env:
      EVENT: ${{ github.event_name }}
      SHIP_MODE: ${{ vars.SHIP_MODE }}
      KIND: ${{ needs.plan.outputs.kind }}
      STAMPED: ${{ needs.plan.outputs.stamped }}
      INPUT_PIPE: ${{ inputs.pipe }}
      PIPE: ${{ needs.decide.outputs.pipe }}
      DECIDE: ${{ needs.decide.result }}
      PLAN: ${{ needs.plan.result }}
      UNIT: ${{ needs.unit.result }}
      BLOCK: ${{ needs.block.result }}
      LIVE_OK: ${{ needs.live-ok.result }}
      DOCS_ONLY: ${{ needs.plan.outputs.docs_only }}
      SKIP_BLOCK: ${{ needs.plan.outputs.skip_block }}
    steps:
      - uses: actions/checkout@v7
      - run: tools/operations/ci-all-verdict.sh
      # W4 (minimal addition): every block that ran must hand in flaky.txt, and each flaky spec must be in the unexpired jail
      - if: needs.block.result == 'success'
        uses: actions/download-artifact@v8
        with: { pattern: flaky-block-*, path: flaky }
      - id: fl
        if: needs.block.result == 'success'
        env: { MATRIX: "${{ needs.plan.outputs.matrix }}" }
        run: |
          # unjailed flake = pass + ticket (flake-ticket job): main push always (CI-ARCH PR 1), PR only with pr-green
          PR=; { [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; } || { [ "$EVENT" = pull_request ] && [ "${SHIP_MODE:-strict}" = pr-green ]; } && PR=--pr
          node tools/operations/ci-flaky.mjs all tests/quarantine.json flaky "$(jq '.include | length' <<<"$MATRIX")" $PR
      # P4: the green stamp, keyed by this checkout's git tree hash. Only a PR/push run, only pr-green, only when everything passed (an unjailed
      # flaky spec = no stamp, AC3.11), never for a docs-only run, and not when the push run was itself skipped by a stamp.
      - id: st
        if: success() && vars.SHIP_MODE == 'pr-green' && (github.event_name == 'pull_request' || github.event_name == 'push') && needs.plan.outputs.stamped != 'true' && (needs.plan.outputs.kind == 'full' || needs.plan.outputs.kind == 'affected')
        run: node tools/operations/ci-ship.mjs stamp-write --kind "${{ needs.plan.outputs.kind }}" --flaky-dir flaky
      - if: steps.st.outputs.stamp == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.st.outputs.name }}
          path: stamp.json
          overwrite: true
          retention-days: 30
  # ---- SHIP_MODE pr-green only (skipped while strict/unset), except flake-ticket also runs on main push (CI-ARCH PR 1) ----
  # Tony Nov 15: an unjailed FLAKY spec on a PR = merge (yellow) + a ticket. One issue "flake tickets", a `- [ ]` line per flake, deduped.
  # issues: write lives in this job only.
  flake-ticket:
    needs: [all, postdeploy]
    # CI-ARCH PR 1: also on every main push (strict mode too), so a main retry-pass always leaves a ticket
    if: always() && (vars.SHIP_MODE == 'pr-green' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (needs.all.outputs.tickets != '' || needs.postdeploy.outputs.tickets != '') && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { issues: write, contents: read }
    continue-on-error: true   # never gating: a ticket job failure must not change the run conclusion the ship gate reads
    concurrency: { group: flake-tickets, cancel-in-progress: false }   # one writer at a time (the issue body is read-modify-write)
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TICKETS: ${{ needs.all.outputs.tickets }},${{ needs.postdeploy.outputs.tickets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # CI-ARCH bug (Nov 16): Issues are disabled on this repo, so the gh call fails; a ticket write must never red a run (it gates ship).
        # Fallback = the ticket lands in the job summary + a ::warning:: (the flaky-block-* artifacts keep the names too).
        run: |
          T="$(tr ',' '\n' <<<"$TICKETS" | grep . | sort -u | paste -sd, -)"
          node tools/operations/ci-flake-ticket.mjs "$T" "$RUN_URL" || {
            echo "::warning::flake ticket not filed (issues off or API error): $T"
            { echo "### flake tickets (not filed: issues off)"; tr ',' '\n' <<<"$T" | sed "s|^|- [ ] |; s|\$| ($RUN_URL)|"; } >>"$GITHUB_STEP_SUMMARY"
          }
  # P5: the post-deploy verdict. The main push run IS the post-deploy full run. Confirmed red (a spec failed twice) -> dispatch ship.yml
  # mode=rollback to the last-known-good and, when the red covers more than one merge, the culprit matrix. An unjailed flaky spec only files a ticket
  # (the red run keeps the gate strict). A jailed flake or an infra failure (retry.yml reruns it) does nothing.
  postdeploy:
    needs: [plan, unit, block, all]
    if: always() && github.event_name == 'push' && vars.SHIP_MODE == 'pr-green' && needs.all.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, actions: write }
    outputs:
      tickets: ${{ steps.d.outputs.tickets }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with: { pattern: flaky-block-*, path: flaky }
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : >failed.log
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select((.conclusion == "failure" or .conclusion == "timed_out") and .name != "all" and .name != "postdeploy") | .id'); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" >>failed.log || true
          done
          read -r FAILED INFRA < <(node --input-type=module -e '
            import { parseFailedSpecs } from "./tools/operations/ci-gate.mjs";
            import { shouldRetry } from "./tools/operations/ci-retry.mjs";
            import { readFileSync } from "node:fs";
            const log = readFileSync("failed.log", "utf8");
            console.log((parseFailedSpecs(log).join(",") || "-") + " " + (shouldRetry({ conclusion: "failure", run_attempt: 1 }, log) ? "infra" : "test"));
          ')
          [ "$FAILED" != - ] || FAILED=
          FLAKY="$(cat flaky/*/flaky.txt 2>/dev/null | sort -u | paste -sd, - || true)"
          LKG="$(git rev-parse 'refs/tags/lkg^{commit}' 2>/dev/null || true)"
          echo "postdeploy: failed=[$FAILED] flaky=[$FLAKY] lkg=${LKG:-none} ($INFRA)"
          node tools/operations/ci-ship.mjs postdeploy --failed "$FAILED" --flaky "$FLAKY" --lkg "$LKG" $([ "$INFRA" = infra ] && echo --infra)
          ROLLBACK="$(grep '^rollback=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          HARD="$(grep '^hard=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          if [ -n "$ROLLBACK" ]; then
            # BUG-SHIP-ORDER: bad = the red run's head sha, so the rollback job skips when live already moved PAST it
            gh workflow run ship.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=rollback -f target="$ROLLBACK" -f bad="${{ github.event.workflow_run.head_sha || github.sha }}"
            K="$(git rev-list --first-parent --count "$ROLLBACK..$GITHUB_SHA")"
            echo "confirmed red covers $K merge(s) since $ROLLBACK"
            if [ "$K" -gt 1 ]; then gh workflow run culprit.yml --repo "$GITHUB_REPOSITORY" --ref main -f from="$ROLLBACK" -f to="$GITHUB_SHA" -f specs="$HARD"; fi
          elif [ -n "$HARD" ]; then
            echo "::error::$HARD failed twice and there is no last-known-good tag (git tag lkg <sha>): no rollback was dispatched"
          fi
  # P5: the last-known-good = a commit that was live AND has a full green. This is the tests half (ship.yml `lkg-after-ship` is the other):
  # the full run is green, and production already serves this commit -> move the lkg tag (never backwards).
  lkg:
    needs: [all]
    if: always() && github.event_name == 'push' && vars.SHIP_MODE == 'pr-green' && needs.all.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true }
      - run: |
          live="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://stem-stuff.vercel.app/version.json?t=$(date +%s)" | jq -r '.sha // empty' || true)"
          if [ -z "$live" ] || [[ "$GITHUB_SHA" != "$live"* ]]; then echo "lkg: prod serves ${live:-nothing}, not $GITHUB_SHA: the ship run moves the tag"; exit 0; fi
          if git rev-parse -q --verify refs/tags/lkg >/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" refs/tags/lkg; then echo "lkg: tag is already at or past $GITHUB_SHA"; exit 0; fi
          git tag -f lkg "$GITHUB_SHA"
          git push -f origin refs/tags/lkg
  # bench only: one CSV of this run's job times (queue wait apart from run time) and per-spec seconds from the lane logs
  bench:
    needs: [plan, unit, block]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pipe != 'fast'
    runs-on: ubuntu-24.04
    permissions: { actions: read }
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.run_id }}/${{ github.run_attempt }}
      TAG: ${{ github.run_id }},${{ github.run_attempt }},${{ github.sha }},${{ inputs.mutant }}
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/${RUN%/*}/attempts/${RUN#*/}/jobs?per_page=50" >jobs.json
          echo "run,attempt,sha,mutant,job,conclusion,queue_s,run_s" >jobs.csv
          jq -r --arg t "$TAG" '.jobs[] | select(.name != "bench" and .completed_at != null)
            | [$t, .name, .conclusion, ((.started_at|fromdate) - (.created_at|fromdate)), ((.completed_at|fromdate) - (.started_at|fromdate))] | @csv' jobs.json | tr -d '"' >>jobs.csv
          echo "run,attempt,sha,mutant,job,lane,spec,result,s" >specs.csv
          jq -r '.jobs[] | select(.name | startswith("block ")) | "\(.id) \(.name)"' jobs.json | while read -r id name; do
            # curl, not gh api: gh refuses to print a log that holds terminal escape codes (run 40151630168: 0 spec rows)
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" | sed 's/^[^ ]* //' |
              awk -v t="$TAG" -v j="$name" '/^##\[group\]lane [0-9]+:/ { split($2, a, ":"); lane = a[1] } lane && /^(ok|FAIL) +[^ ]+ [0-9.]+ s$/ { print t "," j "," lane "," $2 "," $1 "," $3 }' >>specs.csv
          done
          { echo '```'; cat jobs.csv; echo; cat specs.csv; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          cat jobs.csv specs.csv
          test "$(wc -l <specs.csv)" -gt 1 || { echo "::error::no spec rows read from the block logs"; exit 1; }
