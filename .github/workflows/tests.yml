# Every PR and every push to main: the whole suite (tests/run-all.sh). Red here = nobody needs to open a chat to know.
name: tests
on:
  pull_request:
  push:
    branches: [main]
# a new push to a PR cancels the run still going for its old commit (main keeps a result per commit)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  shard:   # the suite in 2 halves that run at the same time (SHARD=N/2 in tests/run-all.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30   # worst measured shard 17.7 min + install; 30 leaves room for a slow runner
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sympy networkx
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/package-lock.json }
      # the .pw scripts require("playwright"); tests/package.json pins only playwright-core, so add the same version here
      - run: |
          cd tests && npm ci
          npm i --no-save "playwright@$(node -p "require('playwright-core/package.json').version")"
          # no --with-deps: ubuntu-latest already has Chromium's system libs. Bench run 39915938764: 25 s vs 37 s, and no apt tail (old installs hit 345-514 s)
          npx playwright install chromium
      - run: SHARD=${{ matrix.shard }}/2 tests/run-all.sh
  # the one required check: branch protection wants a check named exactly `all`; it is green only if both shards are
  all:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.shard.result }}" = success
