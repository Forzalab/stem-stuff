<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repair lab</title>
<!-- C2 Repair ladder lab (brain design-round-66 DESIGN-v3 §3): repair.js on the real app.css tokens. Open: python3 serve.py 8823, then
     http://localhost:8823/design/repair-lab.html, or open this file straight from disk. Try it at 360 and desktop.
     FIX is a hand-made Exam 2 item in the A1 shape (noob, repair{steps[], alt{steps[]}}, twin, parent_template): swap it for a bank item
     once A1's SCHEMA.md lands. Nothing is fetched. tests/repair.pw.mjs drives this page through window.lab(opts). -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../vendor/fonts/atkinson.css">
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../repair.css">
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--t-md)/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
main { max-width: 46rem; margin: 0 auto; padding: var(--s5) var(--s4) var(--s7); }
h1 { margin: 0 0 var(--s1); font-size: var(--t-lg); }
.lede, .stem { margin: 0 0 var(--s3); color: var(--muted); font-size: var(--t-sm); }
.stem { color: var(--ink); font-size: var(--t-md); }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); margin: var(--s3) 0 var(--s4); }
.row button { min-height: 36px; padding: 0 var(--s3); border: var(--bw) solid var(--line); border-radius: 8px; background: var(--sheet); color: var(--ink); font: inherit; font-size: var(--t-xs); cursor: pointer; }
.row button:focus-visible { outline: var(--ring) solid var(--focus); outline-offset: 2px; }
#log { margin-top: var(--s4); color: var(--muted); font: 400 var(--t-xs)/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
<h1>Repair lab</h1>
<p class="lede">One ladder, four variants. Pick a case; the events land below.</p>
<div class="row" id="cases">
  <button type="button" data-v="repair" data-e="sign">sign slip</button>
  <button type="button" data-v="repair" data-e="">no family</button>
  <button type="button" data-v="alt" data-e="sign">alt (twin missed)</button>
  <button type="button" data-v="welcome" data-e="">welcome</button>
  <button type="button" data-v="full" data-e="sign">full solution</button>
  <button type="button" data-v="repair" data-e="" data-r="1">no family, server-graded answer</button>  <!-- COPY-PENDING -->
</div>
<p class="stem" id="stem"></p>
<div id="host"></div>
<pre id="log"></pre>
</main>
<script src="../vendor/katex/katex.min.js"></script>
<script src="../vendor/math.min.js"></script>
<script src="../graph.js"></script>
<script src="../copy/repair-lines.js"></script>
<script src="../repair.js"></script>
<script>
"use strict";
/* Exam 2 style: two carts stick, moving opposite ways. v_f = (2·3 − 1·3)/(2+1) = 1.0 m/s. Step labels are digit-free (schema rule) */
const FIX = window.FIX = {
  code: "LAB_MOMCOL_A", type: "num", answer: 1.0, twin: "a", parent_template: "P2_MOMCOL", noob: { tier: 2 },
  stem: "A 2.0 kg cart at 3.0 m/s hits a 1.0 kg cart coming the other way at 3.0 m/s. They stick. Find $v_f$.",
  repair: {
    steps: [
      { id: "given", label: "Name the unknown", kind: "pick", opts: [{ id: "a", md: "$v_f$" }, { id: "b", md: "$m_2$" }], ok: "a",
        miss: { b: "You already know $m_2$. Read the stem again." },
        why: { q: "Which principle?", opts: ["momentum is the same before and after", "kinetic energy is the same before and after", "the faster cart wins"], ok: 0 } },
      { id: "sheet", label: "Which line on the sheet?", kind: "sheet", pool: ["MOM_CONS", "KE", "IMPULSE"], ok: "MOM_CONS" },
      { id: "signs", label: "Set the signs", kind: "fill", tex: "v_f=\\frac{m_1v_1 \\,▢\\, m_2v_2}{m_1+m_2}", opts: ["+", "−", "×"], ok: "−", fam: "sign",
        why: { q: "Why a minus here?", opts: ["the carts move opposite ways", "momentum is always negative", "a minus means slowing down"], ok: 0 } },
      { id: "plug", label: "Add the masses", kind: "num", ok: "3.0", unit: "kg" },
      { id: "answer", label: "Final answer", kind: "num", ok: "1.0", tol: 0.02, unit: "m/s" }
    ],
    alt: { steps: [
      { id: "units", label: "Which unit fits the answer?", kind: "pick", opts: [{ id: "a", md: "m/s" }, { id: "b", md: "kg·m/s" }], ok: "a",
        why: { q: "Why that unit?", opts: ["the question asks for a speed", "momentum is measured in m/s", "the masses cancel to nothing"], ok: 0 } },
      { id: "size", label: "Slower or faster than the first cart?", kind: "pick", opts: [{ id: "a", md: "slower" }, { id: "b", md: "faster" }], ok: "a" },
      { id: "answer", label: "Final answer", kind: "pick", opts: [{ id: "a", md: "$1.0$ m/s" }, { id: "b", md: "$3.0$ m/s" }], ok: "a" }
    ] }
  }
};
const SHEET = { MOM_CONS: "m_1v_1 + m_2v_2 = (m_1+m_2)v_f", KE: "KE = \\tfrac12 mv^2", IMPULSE: "J = F\\Delta t" };
const host = document.getElementById("host"), log = document.getElementById("log");
document.getElementById("stem").innerHTML = Graph.tex(FIX.stem);
let cur = null;
/* remote: the ladder as GET /repair sends it (TONY-DECISIONS #29.7): the answer steps lose ok/opts/tol/miss, a pick answer then shows the
   item's own choices, and the stub below stands in for POST /repair/<code>/check {value} -> {ok} (the key stays here, as on the server) */
const KEY = { main: v => Math.abs(parseFloat(String(v).replace(/−/g, "-")) - FIX.answer) <= 0.02 * FIX.answer, alt: v => v === "a" };
const strip = steps => steps.map(st => st.id === "answer" ? (({ ok, opts, tol, miss, ...rest }) => rest)(st) : st);
const REMOTE = { ...FIX, choices: FIX.repair.alt.steps[2].opts,
  repair: { steps: strip(FIX.repair.steps), alt: { steps: strip(FIX.repair.alt.steps) } } };
/* lab({ variant, error, label, remote, grade }): label overrides step one's (the text-only test); grade: the stub on the local item too.
   grade(value) -> Promise<boolean> is what the app wires to /check; the lab logs each value in window.__graded */
window.lab = o => {
  window.__ev = []; window.__graded = []; log.textContent = "";
  if (cur) cur.destroy();
  const base = o.remote ? REMOTE : FIX;
  const item = o.label ? { ...base, repair: { ...base.repair, steps: [{ ...base.repair.steps[0], label: o.label }, ...base.repair.steps.slice(1)] } } : base;
  const key = KEY[o.variant === "alt" ? "alt" : "main"];
  const grade = v => { window.__graded.push(v); return new Promise(r => setTimeout(() => r(key(v)), 50)); };   // a round trip
  cur = Repair.mount(host, item, { variant: o.variant, error: o.error || null, sheet: SHEET, grade: o.remote || o.grade ? grade : undefined,
    on: (name, data) => { window.__ev.push([name, data]); log.textContent += name + " " + JSON.stringify(data) + "\n"; } });
};
document.getElementById("cases").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) window.lab({ variant: b.dataset.v, error: b.dataset.e, remote: !!b.dataset.r });
});
window.lab({ variant: "repair", error: "sign" });
</script>
</body>
</html>
