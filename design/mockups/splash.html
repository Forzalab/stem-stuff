<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151d2b">
<meta name="color-scheme" content="dark">
<title>Splash mockup</title>
<!-- Mockup of the loading splash (design/SPLASH.md). No text, one mark: the favicon's curve draws itself, the dot pops in, then it
     erases and loops. The CSS below is the same block index.html carries inline; tokens are the app.css dark tokens, copied because
     the splash paints before any stylesheet loads. Tests and shots freeze it with document.getAnimations(). -->
<style>
html { background: #151d2b; }   /* --paper */
body { margin: 0; }
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #151d2b; }
#splash svg { display: block; width: 64px; height: 64px; }
#splash .sp-tile { fill: #1d2839; }   /* --sheet */
#splash .sp-curve { fill: none; stroke: #7ab8ff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1 1.1; animation: sp-draw 2.2s infinite; }   /* --c1 */
#splash .sp-dot { fill: #e7edf6; transform-box: fill-box; transform-origin: center; animation: sp-dot 2.2s infinite; }   /* --ink */
@keyframes sp-draw {
  0% { stroke-dashoffset: 1.05; animation-timing-function: cubic-bezier(.3, 0, .2, 1); }
  32%, 74% { stroke-dashoffset: 0; animation-timing-function: cubic-bezier(.5, 0, .75, 0); }
  92%, 100% { stroke-dashoffset: -1.05; }
}
@keyframes sp-dot {
  0%, 20% { transform: scale(0); animation-timing-function: cubic-bezier(.25, 1, .5, 1); }
  34%, 74% { transform: scale(1); animation-timing-function: cubic-bezier(.5, 0, .75, 0); }
  86%, 100% { transform: scale(0); }
}
@media (prefers-reduced-motion: reduce) {
  #splash .sp-curve, #splash .sp-dot { animation: none; }
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 32 32" focusable="false"><rect class="sp-tile" width="32" height="32" rx="7"/><path class="sp-curve" pathLength="1" d="M6 24C12 24 14 8 26 8"/><circle class="sp-dot" cx="16" cy="16" r="3"/></svg>
</div>
</body>
</html>
