<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pad page round 3d</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../vendor/fonts/atkinson.css">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">   <!-- @font-face only: q | a and the math use faces the app already ships -->
<style>
/* Round 3d (design/MULTITASK.md): the pad page with no header row. The collapse button lives inside the pad (it is the pad's), the q | a
   switch moves next to what it switches, the drag bar is thin, and the controls sit in thumb reach. ?v=1..5, ?tile=q|a, ?len=1..4.
   Tile height: hugs its content, at most 1/3 of a short screen (< 700px) or 45% of a tall one. app.css tokens only. */
body { padding: 0 !important; min-height: 100dvh; display: flex; justify-content: center; align-items: flex-start; }
.phone { position: relative; flex: none; width: min(100vw, 390px); height: min(100dvh, 844px); overflow: hidden; background: var(--paper); }
@media (min-width: 760px) { body { padding: var(--s5) !important; } .phone { border: 2px solid var(--line); border-radius: 10px; } }
.mbar { position: absolute; z-index: 40; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; padding: var(--s2) var(--s3);
  border-bottom: 1px dashed var(--line); background: var(--field); color: var(--muted); font-size: var(--t-xs); }
.mbar b { color: var(--ink); margin-right: var(--s2); }
.homebar { position: absolute; z-index: 41; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--edge); }
.ico { width: var(--ico); height: var(--ico); }

.page { position: absolute; top: 36px; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr); padding: var(--s2) var(--s2) 22px; }
.tile { position: relative; max-height: var(--cap); overflow: hidden; border-radius: 10px; background: var(--sheet); }
.prob { padding: var(--s3) var(--s4); }
.ptxt { margin: 0; font-size: var(--t-md); line-height: var(--lh); }
.eq { margin: var(--s2) 0 0; text-align: center; font-family: KaTeX_Main; font-size: 1.4rem; }
.ptxt i, .eq i { font-family: KaTeX_Math; font-style: italic; }
.fig { display: block; width: 100%; max-width: 12rem; height: auto; margin: var(--s2) auto 0; }
.ans { padding: var(--s3); display: grid; gap: var(--s2); }
.ch { display: flex; align-items: center; gap: var(--s3); min-height: 48px; padding: var(--s1) var(--s3); border: 2px solid var(--line); border-radius: 8px; font-size: var(--t-md); }
.badge { flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%; border: 2px solid var(--edge); display: grid; place-items: center; font-size: var(--t-xs); font-weight: 700; color: var(--muted); }

/* the thin drag bar: a 3px line, 32px wide; the touch area is 44px tall and overlaps the gap only */
.bar { position: relative; height: var(--s3); }
.bar::before { content: ""; position: absolute; left: 50%; top: 50%; width: 32px; height: 3px; margin: -1.5px 0 0 -16px; border-radius: 2px; background: var(--edge); }
.bar::after { content: ""; position: absolute; left: 25%; right: 25%; top: -16px; bottom: -16px; }

.pad { position: relative; min-height: 0; border: 2px solid var(--focus); border-radius: 10px; background: var(--field); padding: var(--s3) var(--s4);
  font-family: var(--mono); font-size: var(--t-sm); line-height: 1.6; white-space: pre; color: var(--ink); overflow: hidden; }
.pad .ph { color: var(--hint); }
.kit { position: absolute; left: var(--s2); right: var(--s2); bottom: var(--s2); display: flex; align-items: center; gap: var(--s2); }
.kit .sp { flex: 1; }
.b48 { width: var(--btn); height: var(--btn); display: grid; place-items: center; border: 2px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); }

/* the q | a switch: KaTeX math italic letters (STYLE.md §2.2) */
.qa { display: inline-flex; align-items: center; gap: 2px; height: var(--btn); padding: 4px; border: 2px solid var(--line); border-radius: 8px; background: var(--field); }   /* the same as the other buttons */
.qa span { width: 40px; height: 36px; display: grid; place-items: center; border-radius: 8px; font-family: KaTeX_Math; font-style: italic; font-size: 1.5rem; line-height: 1; color: var(--muted); }
.qa span.on { background: var(--raised); color: var(--c1); }

/* v1 corner kit: the switch rides the tile's bottom-right corner; collapse at the pad's bottom left, Cut / Copy bottom right */
.v1 .tile .qa { position: absolute; right: var(--s2); bottom: var(--s2); }
.v1 .tile .prob, .v1 .tile .ans { padding-bottom: calc(var(--btn) + var(--s3)); }
/* v2 bleed + thumb row: the tile has no card, it is the page; a hairline with the grabber on it; switch + collapse in the pad's bottom row */
.v2 .tile { background: none; border-radius: 0; }
.v2 .bar::before { width: 32px; }
.v2 .bar { height: var(--s3); background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat; }
.v2 .bar::before { background: var(--edge); box-shadow: 0 0 0 4px var(--paper); }
/* v3 toolbar: one full-width row inside the pad's bottom edge: q | a left, collapse, Cut, Copy right (like a notes app's tool row) */
.v3 .pad { padding-bottom: calc(var(--btn) + var(--s4)); }
.v3 .kit { left: 0; right: 0; bottom: 0; padding: var(--s2); border-top: 1px solid var(--line); background: var(--field); border-radius: 0 0 8px 8px; }
/* v4 the handle is the switch: one pill on the divider; tap q or a, drag it up or down to resize; the tile bleeds */
.v4 .tile { background: none; border-radius: 0; }
.v4 .bar { height: calc(var(--btn) + var(--s1)); display: flex; justify-content: center; align-items: center;
  background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat; }
.v4 .bar::before, .v4 .bar::after { display: none; }
.v4 .bar .qa { position: relative; box-shadow: 0 0 0 4px var(--paper); }
.v4 .bar .qa::before { content: ""; position: absolute; left: 50%; top: -9px; width: 24px; height: 3px; margin-left: -12px; border-radius: 2px; background: var(--edge); }
/* v5 swipe: the tile is two pages, q and a; swipe sideways or tap a dot; the tile bleeds; no switch at all */
.v5 .tile { background: none; border-radius: 0; }
.dots { display: flex; justify-content: center; gap: var(--s2); padding: var(--s1) 0 var(--s2); }
.dots i { display: grid; place-items: center; min-width: 44px; height: 28px; font-family: KaTeX_Math; font-style: italic; font-size: 1.375rem; color: var(--muted); }
.dots i::after { content: ""; display: block; }
.dots i.on { color: var(--c1); }
.v5 .peek { position: absolute; right: 0; top: 0; bottom: 0; width: 12px; background: linear-gradient(90deg, transparent, var(--raised)); opacity: .6; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M20 4l-6.5 6.5M13.5 5v5.5H19M4 20l6.5-6.5M10.5 19v-5.5H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8.5L19 18M8 15.5L19 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</defs></svg>
<div class="phone" id="phone"><div class="mbar" id="mbar"></div><div class="page" id="page"></div><div class="homebar"></div></div>
<script>
const P = new URLSearchParams(location.search), v = +(P.get("v") || 1), tile = P.get("tile") || "q", len = +(P.get("len") || 2);
const ico = id => `<svg class="ico" aria-hidden="true"><use href="#${id}"/></svg>`;
const FIG = `<svg class="fig" viewBox="0 0 220 110" aria-hidden="true"><circle cx="110" cy="55" r="18" fill="none" stroke="var(--c1)" stroke-width="2"/><circle cx="110" cy="55" r="48" fill="none" stroke="var(--edge)" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="158" cy="55" r="5" fill="var(--c2)"/></svg>`;
const Q = { 1: `<p class="ptxt">Differentiate <i>y</i> = <i>x</i>³ + 2<i>x</i>.</p>`, 2: `<p class="ptxt">Solve for <i>x</i>:</p><p class="eq"><i>x</i> + 2 = 11</p>`,
  3: `<p class="ptxt">A 2.0 kg block slides from rest down a frictionless 30° incline. How fast is it moving after 3.0 m?</p>`,
  4: `<p class="ptxt">A satellite is in a circular orbit around the Earth at an altitude that is four times the Earth's radius. Choose all that apply.</p>${FIG}` }[len];
const A = `<div class="ans">${[["A", "−9"], ["B", "13"], ["C", "9"], ["D", "11/2"]].map(([l, t]) => `<div class="ch"><span class="badge">${l}</span>${t}</div>`).join("")}</div>`;
const qa = `<span class="qa" role="group" aria-label="Show above the pad"><span class="${tile === "q" ? "on" : ""}" aria-label="Question">q</span><span class="${tile === "a" ? "on" : ""}" aria-label="Answer">a</span></span>`;
const body = tile === "q" ? `<div class="prob">${Q}</div>` : A;
const PAD = "r = 5 R_E = 3.19e7\nv = sqrt(GM/r) = 3.53e3\nT = 2 pi r / v";
const col = `<span class="b48" aria-label="Hide the scratchpad">${ico("i-collapse")}</span>`, cc = `<span class="b48" aria-label="Cut">${ico("i-cut")}</span><span class="b48" aria-label="Copy">${ico("i-copy")}</span>`;
const kits = {
  1: `${col}<span class="sp"></span>${cc}`,
  2: `${qa}${col}<span class="sp"></span>${cc}`,
  3: `${qa}<span class="sp"></span>${col}${cc}`,
  4: `${col}<span class="sp"></span>${cc}`,
  5: `${col}<span class="sp"></span>${cc}` };
const tileIn = v === 1 ? body + qa : v === 5 ? body + `<div class="dots" role="tablist"><i class="${tile === "q" ? "on" : ""}" role="tab" aria-label="Question">q</i><i class="${tile === "a" ? "on" : ""}" role="tab" aria-label="Answer">a</i></div><span class="peek"></span>` : body;
const bar = v === 4 ? `<div class="bar">${qa}</div>` : `<div class="bar" role="separator" aria-label="Resize"></div>`;
const vh = Math.min(innerHeight, 844);
document.getElementById("phone").classList.add("v" + v);
document.getElementById("phone").style.setProperty("--cap", Math.round((vh < 700 ? 1 / 3 : 0.45) * vh) + "px");
document.getElementById("page").innerHTML = `<div class="tile">${tileIn}</div>${bar}<div class="pad">${PAD}<div class="kit">${kits[v]}</div></div>`;
const NAMES = { 1: "corner kit", 2: "bleed + thumb row", 3: "pad toolbar", 4: "the handle is the switch", 5: "swipe pages" };
document.getElementById("mbar").innerHTML = `<b>3d · ${v}</b>${NAMES[v]} · ${tile} · len ${len}`;
</script>
</body>
</html>
