<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multitask mockup</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../vendor/fonts/atkinson.css">
<link rel="stylesheet" href="../../app.css">
<style>
/* Multitask mockup (design/MULTITASK.md). Only app.css tokens: colors, --t-*, --s*, --btn, --shadow-*, radii 8/10, borders 1/2px.
   Mock chrome (the top strip, the fake keyboard, the side notes) is dashed so it never reads as product UI. */
body { padding: 0 !important; min-height: 100dvh; display: flex; justify-content: center; align-items: flex-start; gap: var(--s6); }
.phone { position: relative; flex: none; width: min(100vw, 390px); height: min(100dvh, 844px); overflow: hidden; background: var(--paper); --kbh: 34px; }
.phone[data-kb="1"] { --kbh: 300px; }
@media (min-width: 760px) { body { padding: var(--s5) !important; } .phone { border: 2px solid var(--line); border-radius: 10px; } }

/* ---------- mock chrome ---------- */
.mbar { position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: var(--s1); padding: 0 var(--s2);
  background: var(--field); border-bottom: 1px dashed var(--line); font-size: var(--t-xs); line-height: 1.2; color: var(--muted); }
.mbar .mlbl { flex: 1 0 96px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbar .mlbl b { color: var(--ink); }
.mbar .mlbl span { display: block; color: var(--hint); }
.mchip { flex: none; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 8px; background: none; color: var(--muted); font-size: var(--t-xs); }
.mchip[aria-pressed="true"] { border-style: solid; border-color: var(--c1); color: var(--c1); }
.mchip .ico { width: 1.25rem; height: 1.25rem; }
.mchips { flex: 0 1 auto; min-width: 0; display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; }   /* 11 variant chips scroll sideways */
.mchips::-webkit-scrollbar { display: none; }
.screen { position: absolute; top: 44px; left: 0; right: 0; bottom: var(--kbh); overflow: hidden; }
.kb { position: absolute; z-index: 25; left: 0; right: 0; bottom: 0; height: 300px; padding: var(--s2) var(--s1) var(--s6); display: none; flex-direction: column; gap: var(--s2);
  background: var(--raised); border-top: 1px dashed var(--line); }
.phone[data-kb="1"] .kb { display: flex; }
.kb .row { flex: 1 1 0; display: flex; gap: 5px; justify-content: center; }
.kb button { flex: 1 1 0; max-width: 36px; padding: 0; border: 0; border-radius: 8px; background: var(--line); color: var(--ink); font-size: var(--t-sm); }
.kb button.w { max-width: none; flex: 2 1 0; color: var(--muted); font-size: var(--t-xs); }
.kb button.sp { flex: 5 1 0; max-width: none; }
.kb button .ico { margin: auto; width: 20px; height: 20px; }
.homebar { position: absolute; left: 50%; bottom: 10px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--edge); }
.phone[data-kb="1"] .homebar { display: none; }
.notes { display: none; }
@media (min-width: 760px) {
  .notes { display: block; width: 22rem; font-size: var(--t-sm); color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: var(--s4); }
  .notes h1 { margin: 0 0 var(--s3); font-size: var(--t-md); color: var(--ink); }
  .notes ol { margin: 0 0 var(--s4); padding-left: var(--s5); }
  .notes li { margin-bottom: var(--s2); }
  .notes li b { color: var(--ink); }
  .notes button { font-size: var(--t-xs); background: none; border: 1px dashed var(--line); border-radius: 8px; color: var(--c1); padding: var(--s1) var(--s2); margin: 2px 2px 0 0; }
  .notes .mem { font-family: var(--mono); font-size: var(--t-xs); color: var(--hint); white-space: pre-wrap; margin: 0; }
}

/* ---------- shared parts (app.css look) ---------- */
.card { background: var(--sheet); border-radius: 10px; }
.prob { padding: var(--s3) var(--s4); }
.code { margin: 0 0 var(--s2); font-size: var(--t-sm); line-height: 1.3; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
.ptxt { margin: 0 0 var(--s2); max-width: 65ch; }
.fig { display: block; width: 100%; max-width: 15rem; height: auto; margin: var(--s2) 0 0; }
.fig * { vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.gv { font-weight: inherit; }
.qa { padding: 0 var(--s4) var(--s4); }
.how { margin: 0 0 var(--s2); color: var(--muted); font-size: var(--t-sm); line-height: 1.4; }
.fld { display: flex; align-items: center; height: var(--fld); padding-left: var(--s3); background: var(--field); border: 2px solid var(--edge); border-radius: 8px; }
.fld:focus-within { border-color: var(--focus); outline: 3px solid var(--focus); outline-offset: 2px; }
.fld .lead { flex: none; white-space: nowrap; color: var(--muted); margin-right: var(--s2); font-family: var(--mono); }
.fld input { flex: 1 1 auto; min-width: 0; height: 100%; margin: 0; padding: 0 var(--s2) 0 0; border: 0; background: transparent; color: var(--ink);
  font: 400 var(--t-md)/1 var(--mono); caret-color: var(--focus); }
.fld input:focus { outline: none; }
.fld input::placeholder { color: var(--hint); opacity: 1; }
.scr { display: block; width: 100%; margin: 0; resize: none; padding: var(--s3) var(--s3); background: var(--field); color: var(--ink); border: 2px solid var(--edge); border-radius: 8px;
  font: 400 var(--t-sm)/1.6 var(--mono); caret-color: var(--focus); overflow-y: auto; overscroll-behavior: contain; white-space: pre-wrap; overflow-wrap: anywhere; }
.scr:focus { outline: none; border-color: var(--focus); }
.scr::placeholder { color: var(--hint); opacity: 1; }
.xl { display: flex; align-items: center; gap: var(--s2); color: var(--muted); font-size: var(--t-sm); font-weight: 700; }
.xl .ico { width: 1.25rem; height: 1.25rem; }
/* the mode switch: Swap's document | pencil pill (app.css .btn-tgl), here "problem showing" | "pad only" */
.seg { width: auto; display: inline-flex; align-items: center; gap: var(--s3); padding: 0 var(--s3); }
.seg::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 6px; width: 36px; border-radius: 6px; background: var(--raised); transition: transform 200ms ease-out; }
.seg:hover { background: var(--sheet); }
.seg .ico { position: relative; color: var(--muted); transition: color 200ms ease-out; }
.seg[data-on="peek"] .t-doc, .seg[data-on="full"] .t-pen { color: var(--c1); }
.seg[data-on="full"]::before { transform: translateX(36px); }
/* the pad's header: mode switch left, the grab handle in the middle, collapse ALWAYS in the right corner */
.phead { flex: none; position: relative; height: calc(var(--btn) + var(--s3)); display: flex; align-items: center; justify-content: space-between; }
.grip { position: absolute; left: 50%; top: 50%; width: 88px; height: 44px; margin: -22px 0 0 -44px; padding: 0; display: grid; place-items: center; background: none; border: 0; border-radius: 8px; touch-action: none; cursor: grab; }
.grip::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--edge); }
.grip:hover::before { background: var(--muted); }
.pad { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pad .scr { flex: 1 1 auto; min-height: 0; }
.chipln { display: flex; align-items: center; gap: var(--s2); min-width: 0; height: 100%; padding: 0 var(--s3); color: var(--ink); font-size: var(--t-sm); }
.chipln .ico { color: var(--muted); width: 20px; height: 20px; }
.chipln .c { font-weight: 700; color: var(--muted); letter-spacing: 0.04em; flex: none; }
.chipln .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tapx { cursor: pointer; }
/* a scrolling peek fades at its bottom edge, as the freeze strip does (FREEZE.md) */
.peek { -webkit-mask-image: linear-gradient(#000 calc(100% - 1.5rem), transparent); mask-image: linear-gradient(#000 calc(100% - 1.5rem), transparent); }
.snapline { position: absolute; z-index: 9; left: var(--s2); right: var(--s2); height: 0; border-top: 2px dashed var(--edge); opacity: 0; pointer-events: none; transition: opacity 120ms ease-out; }
.dragging .snapline { opacity: 1; }
.dragging, .dragging * { transition: none !important; }
.phone.instant * { transition: none !important; }

/* ---------- home: the page as it is (tap into the pad, or the expand icon, to open) ---------- */
.home { position: absolute; inset: 0; overflow-y: auto; padding: var(--s4) var(--s4) var(--s6); }
.home .xrow { display: flex; align-items: center; justify-content: space-between; margin: var(--s4) 0 var(--s2); }
.home .scr { min-height: calc(5 * 1.6em + 1.5rem + 4px); }

/* ---------- 1. Pop-up: the pad is a floating window over the page; full = maximized, the problem minimizes to a bubble ---------- */
.v1 .bg { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--s4) var(--s4) calc(58% + var(--s4)); }
.v1 .win { position: absolute; z-index: 3; left: var(--s2); right: var(--s2); top: calc(42% - var(--s2)); height: 58%; display: flex; flex-direction: column;
  padding: 0 var(--s2) var(--s2); background: var(--sheet); border-radius: 10px; box-shadow: var(--shadow-3); }
.v1 .win .phead { touch-action: none; }
.v1[data-mode="full"] .win { top: var(--s2); height: calc(100% - var(--s4)); }
.v1 .bubble { position: absolute; z-index: 4; box-shadow: var(--shadow-3); touch-action: none; opacity: 0; pointer-events: none; transition: opacity 200ms ease-out; }
.v1[data-mode="full"] .bubble { opacity: 1; transform: none; pointer-events: auto; }

/* ---------- 2. Split: problem pane / divider (the pad's header) / pad; snaps chip, 1/3, 1/2 ---------- */
.v2 { position: absolute; inset: 0; display: grid; grid-template-rows: calc(var(--r) * 100%) minmax(0, 1fr); padding: var(--s2) var(--s2) var(--s2); }
.v2[data-mode="full"] { grid-template-rows: 52px minmax(0, 1fr); }
.v2 .top { position: relative; min-height: 0; overflow: hidden; }
.v2 .top .peek { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; }
.v2 .top .chipln { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.v2[data-mode="full"] .top .peek { opacity: 0; pointer-events: none; }
.v2[data-mode="full"] .top .chipln { opacity: 1; pointer-events: auto; }
.v2 .phead { touch-action: none; cursor: grab; }

/* ---------- 3. Tiles: problem / answer / pad tiles, 8px gaps, the focused tile outlined (Pop Shell); full = one tile + tabs (i3 tabbed) ---------- */
.v3 { position: absolute; inset: 0; padding: var(--s2); display: grid; gap: var(--s2); grid-template-rows: minmax(0, 34%) auto minmax(0, 1fr); grid-template-areas: "p" "a" "w"; }
.v3[data-mode="full"] { grid-template-rows: 52px minmax(0, 1fr); grid-template-areas: "t" "w"; }
.v3 .tile { min-height: 0; border-radius: 10px; background: var(--sheet); }
.v3 .t-p { grid-area: p; overflow-y: auto; overscroll-behavior: contain; }
.v3 .t-a { grid-area: a; padding: var(--s3); }
.v3 .t-a .how { margin: 0 0 var(--s2); }
.v3 .t-w { grid-area: w; padding: 0 var(--s2) var(--s2); }
.v3 .tabs { grid-area: t; display: none; gap: var(--s2); }
.v3[data-mode="full"] .tabs { display: flex; }
.v3[data-mode="full"] .t-p, .v3[data-mode="full"] .t-a { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }   /* still focusable, so the keyboard stays */
.v3 .tab { flex: 1 1 0; min-width: 0; height: 100%; border: 2px solid var(--edge); border-radius: 8px; background: var(--sheet); padding: 0; }
.v3 .tab:hover { background: var(--raised); border-color: var(--muted); }
.v3 .tab.ans .chipln .t { color: var(--muted); }

/* ---------- 4. Hold to peek: pad fills; the problem is a chip; hold it to see the card, pull down to pin it ---------- */
.v4 { position: absolute; inset: 0; padding: var(--s2); display: grid; gap: var(--s2); grid-template-rows: 52px minmax(0, 1fr); }
.v4[data-mode="peek"] { grid-template-rows: minmax(0, 40%) minmax(0, 1fr); }
.v4 .top { position: relative; min-height: 0; overflow: hidden; }
.v4 .top .chipln { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.v4 .top .hint { margin-left: auto; flex: none; color: var(--muted); font-size: var(--t-sm); }
.v4 .top .peek { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; opacity: 0; pointer-events: none; }
.v4[data-mode="peek"] .top .peek { opacity: 1; pointer-events: auto; }
.v4[data-mode="peek"] .top .chipln { opacity: 0; pointer-events: none; }
.v4 .pop { position: absolute; z-index: 5; left: var(--s2); right: var(--s2); top: calc(52px + var(--s3)); max-height: calc(100% - 52px - var(--s5)); overflow: hidden;
  box-shadow: var(--shadow-3); opacity: 0; transform: translateY(-12px); pointer-events: none; transition: opacity 200ms ease-out, transform 200ms ease-out; }
.v4.holding .pop { opacity: 1; transform: none; }
.v4 .pop .pull { display: flex; align-items: center; justify-content: center; gap: var(--s2); padding: var(--s2); color: var(--muted); font-size: var(--t-sm); border-top: 1px solid var(--line); }
.v4 .pop .pull .ico { width: 1.25rem; height: 1.25rem; }

/* ---------- 5. Picture in picture: pad fills; the problem is a thumbnail in a corner; drop it on the top edge to dock it (peek) ---------- */
.v5 { position: absolute; inset: 0; }
.v5 .pad { position: absolute; left: var(--s2); right: var(--s2); bottom: var(--s2); top: 0; }
.v5[data-mode="peek"] .pad { top: calc(40% + var(--s2)); }
.v5 .pip { position: absolute; z-index: 4; overflow: hidden; box-shadow: var(--shadow-3); touch-action: none; cursor: grab; }
.v5[data-mode="full"] .pip { width: 152px; height: 116px; }
.v5[data-mode="full"][data-corner$="l"] .pip { left: var(--s2); }
.v5[data-mode="full"][data-corner$="r"] .pip { left: calc(100% - 152px - var(--s2)); }
.v5[data-mode="full"][data-corner^="t"] .pip { top: calc(var(--btn) + var(--s4)); }
.v5[data-mode="full"][data-corner^="b"] .pip { top: calc(100% - 116px - var(--s3)); }
.v5[data-mode="peek"] .pip { left: var(--s2); top: var(--s2); width: calc(100% - var(--s4)); height: 40%; box-shadow: none; cursor: default; touch-action: auto; }
.v5 .pip .mini { position: absolute; inset: 0; pointer-events: none; }
.v5 .pip .mini { display: flex; flex-direction: column; padding: var(--s2) var(--s3); }
.v5 .pip .mini .fig { width: 100%; max-width: none; flex: 1 1 auto; min-height: 0; margin: 0; }
.v5 .pip .mini .code { margin: var(--s1) 0 0; }
.v5 .pip .peek { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; opacity: 0; pointer-events: none; }
.v5[data-mode="peek"] .pip .mini { opacity: 0; }
.v5[data-mode="peek"] .pip .peek { opacity: 1; pointer-events: auto; }
.v5[data-mode="full"][data-corner^="b"] .scr { padding-bottom: 124px; scroll-padding-bottom: 124px; }
.v5 .ghost { position: absolute; z-index: 3; border: 2px dashed var(--edge); border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity 120ms ease-out; }
.v5.dragging .ghost { opacity: .7; }

/* ---------- 6. Givens ribbon: pad fills; the problem shrinks to its givens; pull the ribbon down for the whole question ---------- */
.v6 { position: absolute; inset: 0; padding: var(--s2); display: grid; gap: var(--s5); grid-template-rows: 56px minmax(0, 1fr); }
.v6[data-mode="peek"] { grid-template-rows: minmax(0, 40%) minmax(0, 1fr); }
.v6 .rib { position: relative; min-height: 0; }
.v6 .rib .gvs { position: absolute; inset: 0; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); overflow-x: auto; }
.v6 .g { flex: none; display: inline-flex; align-items: baseline; gap: var(--s1); height: 36px; padding: 0 var(--s3); align-items: center; border-radius: 8px; background: var(--raised); font-family: var(--mono); font-size: var(--t-sm); white-space: nowrap; }
.v6 .g i { font-style: normal; color: var(--muted); }
.v6 .g.find { background: none; color: var(--muted); }
.v6 .g.find b { color: var(--ink); font-weight: 400; }
.v6 .rib .peek { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; opacity: 0; pointer-events: none; }
.v6[data-mode="peek"] .rib .gvs { opacity: 0; pointer-events: none; }
.v6[data-mode="peek"] .rib .peek { opacity: 1; pointer-events: auto; }
.v6[data-mode="peek"] .gv { color: var(--ink); background: var(--raised); border-radius: 4px; padding: 0 var(--s1); }
.v6 .pull { position: absolute; z-index: 3; left: 50%; top: 100%; width: 88px; height: 44px; margin-left: -44px; padding: var(--s2) 0 0; display: grid; place-items: start center; background: none; border: 0; touch-action: none; cursor: grab; }
.v6 .pull::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--edge); }


/* ================= Round 2 (MULTITASK.md "Round 2"): variants 7-11 ================= */
.flip { transform: rotate(180deg); }
.vhide { position: absolute !important; width: 1px !important; height: 1px !important; overflow: hidden !important; clip-path: inset(50%) !important; }   /* hidden, still focusable */

/* ---------- 7. Composer: chat reply. One column: header, the quoted problem, the pad, the answer docked at the bottom (on the keyboard) ---------- */
.v7 { position: absolute; inset: 0; padding: 0 var(--s2) var(--s2); }
.v7 .box { height: 100%; gap: var(--s2); }
.v7 .q { flex: none; position: relative; height: 52px; margin: 0; overflow: hidden; }
.v7[data-mode="peek"] .q { height: 38%; }
.v7 .q .peek { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; opacity: 0; pointer-events: none; }
.v7 .q .chipln { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.v7[data-mode="peek"] .q .peek { opacity: 1; pointer-events: auto; }
.v7[data-mode="peek"] .q .chipln { opacity: 0; pointer-events: none; }
.v7 .ansd { flex: none; }

/* ---------- 8. Mini player: the problem is a floating sheet at the bottom with 2 detents (small bar | half); pull it up past half = back to the page ---------- */
.v8 { position: absolute; inset: 0; --sh: 60px; }
.v8[data-mode="peek"] { --sh: 50%; }
.v8 .pad { position: absolute; left: var(--s2); right: var(--s2); top: 0; bottom: calc(var(--sh) + var(--s4)); }
.v8 .sheet { position: absolute; z-index: 4; left: var(--s2); right: var(--s2); bottom: var(--s2); height: var(--sh); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-3); }
.v8 .srow { flex: none; position: relative; height: 60px; display: flex; align-items: center; gap: var(--s2); padding: var(--s1) var(--s1) 0 0; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.v8 .srow::before { content: ""; position: absolute; left: 50%; top: 6px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--edge); }
.v8 .srow .chipln { flex: 1 1 auto; }
.v8 .speek { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.v8 .speek .prob { padding-top: 0; }
.v8 .speek .code { display: none; }
.v8 .sans { flex: none; padding: var(--s2) var(--s3) var(--s3); }
.v8[data-mode="peek"] .srow .chipln .t { visibility: hidden; }
.v8[data-mode="full"] .speek, .v8[data-mode="full"] .sans { opacity: 0; pointer-events: none; }

/* ---------- 9. Answer sliver (90:10): the problem pane is pushed up, never shrunk; what stays is its bottom edge, which is the answer box ---------- */
.v9 { position: absolute; inset: 0; padding: var(--s2) var(--s2) var(--s2); display: grid; grid-template-rows: minmax(0, 50%) minmax(0, 1fr); }
.v9[data-mode="full"] { grid-template-rows: calc(var(--fld) + var(--s4)) minmax(0, 1fr); }
.v9 .top { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.v9 .top .peek { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.v9 .sl { flex: none; display: flex; align-items: center; gap: var(--s2); padding: var(--s2); }
.v9 .sl .fld { flex: 1 1 auto; min-width: 0; }
.v9 .sl .sdoc { display: none; }
.v9[data-mode="full"] .top .peek { flex: 0 0 0; opacity: 0; pointer-events: none; }
.v9[data-mode="full"] .sl .sdoc { display: inline-grid; }
.v9 .phead { touch-action: none; cursor: grab; }

/* ---------- 10. Inline title: large title -> inline title. Full: the problem folds into the pad's own header (no extra row); scroll-linked ---------- */
.v10 { position: absolute; inset: 0; padding: var(--s2) var(--s2) var(--s2); display: grid; grid-template-rows: minmax(0, 40%) minmax(0, 1fr); }
.v10[data-mode="full"] { grid-template-rows: 0 minmax(0, 1fr); padding-top: 0; }
.v10 .q { position: relative; min-height: 0; overflow: hidden; }
.v10 .q .peek { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; }
.v10[data-mode="full"] .q { opacity: 0; pointer-events: none; }
.v10 .phead { gap: var(--s2); }
.v10 .ttl { display: none; flex: 1 1 auto; width: auto; min-width: 0; place-items: stretch; }
.v10 .ttl .chipln { padding: 0 var(--s2); }
.v10[data-mode="full"] .ttl { display: inline-grid; }

/* ---------- 11. Side column (Slide Over): pad left | problem right, side by side; full = the problem stashed off the right edge, a 52px strip stays ---------- */
.v11 { position: absolute; inset: 0; padding: var(--s2); display: grid; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr); }
.v11[data-mode="full"] { grid-template-columns: minmax(0, 1fr) var(--s2) 52px; }
.v11 .pad .scr { padding: var(--s2); }
.v11 .dv { position: relative; }
.v11 .dv .grip { width: 44px; height: 88px; margin: -44px 0 0 -22px; z-index: 2; }
.v11 .dv .grip::before { width: 4px; height: 36px; }
.v11[data-mode="full"] .dv .grip { display: none; }
.v11 .col { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.v11 .col .peek { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.v11 .col .prob { padding: var(--s3); }
.v11 .col .fig { max-width: 100%; }
.v11 .cans { flex: none; padding: 0 var(--s2) var(--s2); }
.v11 .cans .fld input { padding-left: 0; }
.v11 .strip { display: none; flex: 1 1 auto; width: 100%; flex-direction: column; align-items: center; gap: var(--s3); padding: var(--s4) 0; margin: 0; background: none; border: 0; border-radius: 10px; color: var(--muted); touch-action: none; cursor: pointer; }
.v11 .strip:hover { background: var(--raised); }
.v11 .strip:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.v11 .strip .ico { width: 1.25rem; height: 1.25rem; }
.v11 .strip .vc { writing-mode: vertical-rl; font-size: var(--t-sm); font-weight: 700; letter-spacing: 0.04em; }
.v11[data-mode="full"] .strip { display: flex; }
.v11[data-mode="full"] .col .peek, .v11[data-mode="full"] .cans { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ---------- tablet landscape + desktop mocks (?v=tab, ?v=desk&opt=N): no phone frame ---------- */
body.wide { display: block; padding: 0 !important; }
.wide .phone, .wide .notes { display: none; }
.big { display: none; }
.wide .big { display: flex; flex-direction: column; height: 100dvh; padding: 0 var(--s5) var(--s5); }
.big .tbar { flex: none; display: flex; align-items: center; gap: var(--s2); padding: var(--s4) 0; max-width: 84rem; width: 100%; margin: 0 auto; }
.big .tbar .fld { flex: 1 1 auto; max-width: 30rem; }
.big .tbar .fld input { font-family: inherit; font-weight: 700; letter-spacing: .06em; }
.big .tbar .sp { flex: 1 1 auto; }
.big .split { flex: 1 1 auto; min-height: 0; position: relative; max-width: 84rem; width: 100%; margin: 0 auto; display: grid; grid-template-columns: calc(var(--r) * 100%) 24px minmax(0, 1fr); }
.big .split.stack { grid-template-columns: minmax(0, 1fr); max-width: var(--col); width: 100%; margin: 0 auto; overflow-y: auto; }
.big .left { min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: var(--s4); }
.big .left .card { flex: none; }
.big .right { min-height: 0; }
.big .split.stack .right { min-height: 24rem; margin-top: var(--s4); }
.big .split.stack .sash { display: none; }
.big .sash { position: relative; display: grid; place-items: center; cursor: col-resize; touch-action: none; border-radius: 8px; }
.big .sash::before { content: ""; width: 4px; height: 36px; border-radius: 2px; background: var(--edge); }
.big .sash:hover::before, .big .sash:focus-visible::before { background: var(--muted); }
.big .sash .tick { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--edge); opacity: 0; pointer-events: none; }
.big .split.dragging .sash .tick { opacity: .8; }
.big .phead .xl { margin-right: auto; }
.big .phead .btns { display: flex; gap: var(--s2); }

.big .right .pad { height: 100%; }
.flyout { position: absolute; z-index: 10; right: 0; top: calc(var(--btn) + var(--s3)); display: flex; gap: var(--s3); padding: var(--s3); background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-3); }
.flyout[hidden] { display: none; }
.lay { width: 96px; height: 64px; padding: 6px; display: grid; gap: 4px; background: var(--field); border: 2px solid var(--line); border-radius: 8px; }
.lay i { display: block; border-radius: 4px; background: var(--line); }
.lay[aria-pressed="true"] { border-color: var(--c1); }
.lay:hover i { background: var(--edge); }
.lay i.w { background: var(--edge); }
.lay.stk { grid-template-rows: 2fr 3fr; }
.lay.half { grid-template-columns: 1fr 1fr; }
.lay.wide2 { grid-template-columns: 1fr 2fr; }
.laylbl { margin-top: var(--s1); font-size: var(--t-sm); color: var(--muted); text-align: center; }
.keys { flex: none; display: flex; flex-wrap: wrap; gap: var(--s5); justify-content: center; padding: var(--s3) 0 0; font-size: var(--t-sm); color: var(--muted); }
.keys kbd { font: 700 var(--t-xs)/1 var(--mono); color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 3px 6px; }
/* Desktop, revised (opt=r2): side by side is the default down to 720px (two panes of 340px+); under 720px it is the phone page, and the expand button opens the phone pick (variant 9) */
.big .narrow-only { display: none; }
@media (max-width: 719.98px) { .big .split.r2 .narrow-only { display: inline-grid; } }
@media (max-width: 719.98px) { .big .split.r2 { grid-template-columns: minmax(0, 1fr); max-width: var(--col); overflow-y: auto; } .big .split.r2 .sash { display: none; } .big .split.r2 .right { min-height: 24rem; margin-top: var(--s4); } .big .split.r2 [data-a="stack"] { display: none; } }
.mocktag { flex: none; font-size: var(--t-xs); color: var(--hint); border: 1px dashed var(--line); border-radius: 8px; padding: var(--s1) var(--s2); background: var(--paper); }

::view-transition-group(root), ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 200ms; animation-timing-function: ease-out; }
@media (prefers-reduced-motion: reduce) { .phone *, .big * { transition: none !important; animation: none !important; } }
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

<div class="phone" id="phone" data-kb="0">
  <div class="mbar" id="mbar" aria-label="Mockup controls"></div>
  <div class="screen" id="screen"></div>

</div>
<aside class="notes" id="notes"></aside>

<script>
"use strict";
/* ---------- content ---------- */
const FIG = `<svg class="fig" viewBox="0 0 220 124" aria-label="Block on a 30 degree ramp" role="img">
  <path d="M8 110H212" stroke="var(--ink)" stroke-width="2" fill="none"/>
  ${Array.from({length: 24}, (_, i) => `<path d="M${16 + i * 8} 114l-6 6" stroke="var(--muted)" stroke-width="1.5"/>`).join("")}
  <path d="M20 110L190 110L190 12Z" fill="var(--sheet)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M52 110A32 32 0 0 0 47.7 94" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="58" y="104" fill="var(--muted)" font-size="14" font-family="Atkinson Hyperlegible">30°</text>
  <path d="M90.3 69.5L119.7 52.5L108.7 33.4L79.3 50.4Z" fill="var(--sheet)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M99.5 51.5V84" stroke="var(--c1)" stroke-width="3"/><path d="M93.5 82l6 12 6-12z" fill="var(--c1)"/>
  <text x="108" y="90" fill="var(--c1)" font-size="16" font-style="italic" font-family="Atkinson Hyperlegible">mg</text>
</svg>`;
const CODE = "PHYS_F3N";
const TEXT = `A <b class="gv">4.0 kg</b> block slides down a <b class="gv">30°</b> ramp. The coefficient of kinetic friction is <b class="gv">0.20</b>. Find the block’s acceleration down the ramp, in m/s².`;
const PLAIN = "A 4.0 kg block slides down a 30° ramp. The coefficient of kinetic…";
const PAD0 = "N = mg cos30 = 33.9\nf = 0.20 N = 6.79\nmg sin30 = 19.6\nF = 19.6 - 6.79\n  = 12.8\na = F / m";
const prob = (fig = true) => `<div class="prob"><p class="code">${CODE}</p><p class="ptxt">${TEXT}</p>${fig ? FIG : ""}</div>`;
const qa = () => `<div class="qa"><p class="how">One number, in m/s².</p><label class="fld"><input class="ans" inputmode="decimal" autocomplete="off" placeholder="e.g. 9/2, sqrt(3)" aria-label="Answer"><button type="button" class="btn btn-go" data-act="noop" aria-label="Check answer"><svg class="ico"><use href="#i-go"/></svg></button></label></div>`;
const ico = (id) => `<svg class="ico" aria-hidden="true"><use href="#${id}"/></svg>`;
const seg = () => `<button type="button" class="btn seg" data-act="mode">${ico("i-doc").replace('class="ico"', 'class="ico t-doc"')}${ico("i-pen").replace('class="ico"', 'class="ico t-pen"')}</button>`;
const collapse = () => `<button type="button" class="btn" data-act="collapse" aria-label="Collapse the scratchpad" title="Collapse">${ico("i-collapse")}</button>`;
const phead = (grip = true) => `<div class="phead">${seg()}${grip ? `<button type="button" class="grip" data-act="grip" aria-label="Move"></button>` : ""}${collapse()}</div>`;
const ta = () => `<textarea class="scr" spellcheck="false" autocapitalize="off" aria-label="Scratchpad" placeholder="Work it out here"></textarea>`;
const chip = () => `<div class="chipln">${ico("i-doc")}<span class="c">${CODE}</span><span class="t">${PLAIN}</span></div>`;

/* ---------- variants ---------- */
const V = {
  1: { name: "Pop-up", def: { mode: "peek", side: "r", slot: 1 },
       html: () => `<div class="v1" id="vr"><div class="bg tapx" data-exit>${`<div class="card">${prob()}</div>`}</div>
         <div class="win pad" id="win">${phead()}${ta()}</div>
         <button type="button" class="btn bubble" id="bubble" aria-label="Problem: tap to go back to it">${ico("i-doc")}</button></div>` },
  2: { name: "Split", def: { mode: "peek", r: .5 },
       html: () => `<div class="v2" id="vr"><div class="top card tapx" data-exit><div class="peek">${prob()}</div>${chip()}</div>
         <div class="pad">${phead()}${ta()}</div><div class="snapline" id="s1"></div><div class="snapline" id="s2"></div><div class="snapline" id="s3"></div></div>` },
  3: { name: "Tiles", def: { mode: "peek" },
       html: () => `<div class="v3" id="vr"><div class="tabs"><button type="button" class="tab" data-act="exit" aria-label="Problem: go back to it"><div class="chipln">${ico("i-doc")}<span class="t">Problem</span></div></button>
         <button type="button" class="tab ans" data-act="anstab" aria-label="Answer">${`<div class="chipln">${ico("i-ok")}<span class="t">Answer</span></div>`}</button></div>
         <div class="tile t-p tapx" data-exit>${prob()}</div>
         <div class="tile t-a"><label class="fld"><span class="lead">a =</span><input class="ans" inputmode="decimal" autocomplete="off" placeholder="e.g. 9/2, sqrt(3)" aria-label="Answer, in m/s²"><button type="button" class="btn btn-go" data-act="noop" aria-label="Check answer">${ico("i-go")}</button></label></div>
         <div class="tile t-w pad">${phead(false)}${ta()}</div></div>` },
  4: { name: "Hold to peek", def: { mode: "full" },
       html: () => `<div class="v4" id="vr"><div class="top card"><div class="peek tapx" data-exit>${prob()}</div>${chip().replace('class="chipln"', 'class="chipln tapx" id="hold"').replace("</div>", `<span class="hint">Hold</span></div>`)}</div>
         <div class="pad">${phead(false)}${ta()}</div>
         <div class="pop card" aria-hidden="true">${prob()}<div class="pull">${ico("i-down")}Pull down to pin</div></div></div>` },
  5: { name: "Picture in picture", def: { mode: "full", corner: "br" },
       html: () => `<div class="v5" id="vr"><div class="pad">${phead(false)}${ta()}</div><div class="ghost" id="ghost"></div>
         <div class="pip card tapx" id="pip" role="button" aria-label="Problem: tap to go back to it"><div class="mini" aria-hidden="true">${FIG}<p class="code">${CODE}</p></div>
         <div class="peek" data-exit>${prob()}</div></div></div>` },
  6: { name: "Givens ribbon", def: { mode: "full" },
       html: () => `<div class="v6" id="vr"><div class="rib card"><div class="gvs tapx" data-exit><span class="g"><i>m</i>4.0 kg</span><span class="g"><i>θ</i>30°</span><span class="g"><i>μk</i>0.20</span><span class="g find">find <b>a</b></span></div>
         <div class="peek tapx" data-exit>${prob()}</div><button type="button" class="pull" id="pull" data-act="mode" aria-label="Show the whole question"></button></div>
         <div class="pad">${phead(false)}${ta()}</div></div>` },
  7: { name: "Composer", def: { mode: "peek" },
       html: () => `<div class="v7" id="vr"><div class="box pad">${phead(false)}<div class="q card" id="quote"><div class="peek tapx" data-exit>${prob()}</div>${chip().replace('class="chipln"', 'class="chipln tapx" id="stub"')}</div>
         ${ta()}<label class="fld ansd"><span class="lead">a =</span><input class="ans" inputmode="decimal" autocomplete="off" placeholder="e.g. 9/2, sqrt(3)" aria-label="Answer, in m/s²"><button type="button" class="btn btn-go" data-act="noop" aria-label="Check answer">${ico("i-go")}</button></label></div></div>` },
  8: { name: "Mini player", def: { mode: "peek" },
       html: () => `<div class="v8" id="vr"><div class="pad">${phead(false)}${ta()}</div>
         <div class="sheet card" id="sheet"><div class="srow" id="srow">${chip()}<button type="button" class="btn" data-act="mode" id="schev" aria-label="Show the whole question">${ico("i-down")}</button></div>
         <div class="speek peek tapx" data-exit>${prob()}</div>
         <div class="sans"><label class="fld"><span class="lead">a =</span><input class="ans" inputmode="decimal" autocomplete="off" placeholder="e.g. 9/2, sqrt(3)" aria-label="Answer, in m/s²"><button type="button" class="btn btn-go" data-act="noop" aria-label="Check answer">${ico("i-go")}</button></label></div></div></div>` },
  9: { name: "Answer sliver", def: { mode: "peek" },
       html: () => `<div class="v9" id="vr"><div class="top card"><div class="peek tapx" data-exit>${prob()}</div>
         <div class="sl"><button type="button" class="btn sdoc" data-act="exit" aria-label="Problem: go back to it" title="Problem">${ico("i-doc")}</button><label class="fld"><span class="lead">a =</span><input class="ans" inputmode="decimal" autocomplete="off" placeholder="e.g. 9/2" aria-label="Answer, in m/s²"><button type="button" class="btn btn-go" data-act="noop" aria-label="Check answer">${ico("i-go")}</button></label></div></div>
         <div class="pad">${phead()}${ta()}</div></div>` },
  10: { name: "Inline title", def: { mode: "peek" },
       html: () => `<div class="v10" id="vr"><div class="q card tapx" data-exit><div class="peek">${prob()}</div></div>
         <div class="pad"><div class="phead">${seg()}<button type="button" class="btn ttl" data-act="exit" aria-label="Problem ${CODE}: go back to it"><span class="chipln">${ico("i-doc")}<span class="c">${CODE}</span><span class="t">find a</span></span></button>${collapse()}</div>${ta()}</div></div>` },
  11: { name: "Side column", def: { mode: "peek" },
       html: () => `<div class="v11" id="vr"><div class="pad">${phead(false)}${ta()}</div>
         <div class="dv"><button type="button" class="grip" data-act="grip" aria-label="Stash the problem at the edge"></button></div>
         <div class="col card"><div class="peek tapx" data-exit>${prob()}</div>
         <div class="cans"><label class="fld"><input class="ans" inputmode="decimal" autocomplete="off" placeholder="m/s²" aria-label="Answer, in m/s²"><button type="button" class="btn btn-go" data-act="noop" aria-label="Check answer">${ico("i-go")}</button></label></div>
         <button type="button" class="strip" id="strip" aria-label="Problem ${CODE}: tap to go back to it">${ico("i-doc")}<span class="vc">${CODE}</span></button></div></div>` },
};

/* ---------- state + memory (per device: localStorage, wrapped in try/catch) ---------- */
const VN = Object.keys(V).map(Number);
const P = new URLSearchParams(location.search);
const KEY = "stem.multitask";
let mem = {};
try { mem = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { mem = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} };
const S = { v: +(P.get("v")) || mem.v || 2, open: false, kb: 0, text: PAD0, ans: "", hold: false };
if (!V[S.v]) S.v = 2;
const shot = P.get("state");
const cfg = (v = S.v) => (mem[v] = Object.assign({}, V[v].def, mem[v] || {}));
if (shot) mem = {};   // screenshots: defaults, not this browser's memory

const phone = document.getElementById("phone"), screen = document.getElementById("screen");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s, r = screen) => r.querySelector(s);

function instant() { phone.classList.add("instant"); requestAnimationFrame(() => requestAnimationFrame(() => phone.classList.remove("instant"))); }
function setKb(on) { if (S.kb === on) return; S.kb = on; instant(); phone.dataset.kb = on; drawBar(); }

/* ---------- open / close: Back closes it (pushState), so does tapping the problem, so does the collapse button ---------- */
let after = null, quiet = false, closedAt = -1e9;
function open() {
  if (S.open || performance.now() - closedAt < 400) return;   // the tap that closed it can land as a click on the page's pad: do not reopen
  S.open = true; mem.v = S.v; save();
  try { if (!(history.state && history.state.mt)) history.pushState({ mt: 1 }, ""); } catch (e) {}
  render(); if (S.kb || !shot) focusPad();
}
function close(target) {   // target: "pad" keeps writing inline, "ans" puts the caret in the answer
  if (!S.open || after) return;   // one close at a time (a tap can also fire a click)
  after = target || "pad";
  if (history.state && history.state.mt) history.back(); else doClose();
}
function doClose() {
  if (!S.open) return;
  S.open = false; S.hold = false; closedAt = performance.now(); render();
  const t = after === "ans" ? $(".ans") : $(".scr"); after = null;
  quiet = true;
  if (t && (S.kb || t.classList.contains("ans"))) t.focus({ preventScroll: true });
  if (t && t.classList.contains("ans")) t.scrollIntoView({ block: "center" });
  quiet = false;
}
addEventListener("popstate", () => { if (S.open) doClose(); });
function focusPad() { const t = $(".scr"); if (t) { t.focus({ preventScroll: true }); t.setSelectionRange(t.value.length, t.value.length); t.scrollTop = t.scrollHeight; } }

function setMode(m) {
  const c = cfg(); if (m === undefined) m = c.mode === "peek" ? "full" : "peek";
  vt(() => { c.mode = m; save(); sync(); });
}
/* every snap and mode change is a 200ms crossfade (View Transition), never an animated layout; reduced motion: instant */
function vt(fn) { if (!reduce && document.startViewTransition) document.startViewTransition(fn); else fn(); }

/* ---------- render ---------- */
function render() {
  if (!S.open) {
    screen.innerHTML = `<div class="home"><div class="card">${prob()}${qa()}</div>
      <div class="xrow"><div class="xl">${ico("i-pen")}Scratchpad</div><button type="button" class="btn" data-act="expand" aria-label="Expand the scratchpad" title="Expand">${ico("i-expand")}</button></div>${ta()}</div>`;
  } else screen.innerHTML = V[S.v].html();
  screen.querySelectorAll(".scr").forEach(t => { t.value = S.text; t.addEventListener("input", () => S.text = t.value); });

    if (e.key === "[" && i > 0) { set(SN[i - 1]); e.preventDefault(); }
    if (e.key === "]" && i < 2) { set(SN[i + 1]); e.preventDefault(); }
  });
  if (opt === 3) big.querySelector(".scr").focus({ preventScroll: true });
}

/* ---------- boot: ?v=N&state=home|a|b|peek|full|hold, ?v=tab, ?v=desk&opt=N ---------- */
if (P.get("v") === "tab" || P.get("v") === "desk") bigView(P.get("v"), P.get("opt") === "r2" ? 4 : +(P.get("opt")) || 1);   // opt=r2: Desktop, revised (MULTITASK.md Round 2)
else {
  instant();
  const st = shot || "home", c = cfg();
  if (["a", "peek"].includes(st)) c.mode = "peek";
  if (["b", "full", "hold"].includes(st)) c.mode = "full";
  if (["peek", "full", "hold"].includes(st)) { S.kb = 1; phone.dataset.kb = 1; }
  if (st !== "home") { S.open = true; try { history.pushState({ mt: 1 }, ""); } catch (e) {} }
  render();
  if (S.open && S.kb) focusPad();
  if (st === "hold" && S.v === 4) { S.hold = true; sync(); }
}
