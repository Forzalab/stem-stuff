<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lobby Rewards Mock</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Press+Start+2P&display=swap">
<!-- impeccable-disable gradient-text: LEVEL UP title lives in shared fx.css (Tony's ref, burst only, 1.2 s) -->
<!-- impeccable-disable radial-halo: shared fx.css burst/flash overlay only (1.2-2 s), never the resting page -->
<!-- Sugar-mode reward loop, variant "lobby": social-casino lobby skin (purple floor, gold bevels, candy pills, 3-reel frame, WIN plate).
     Same engine.js / fx.js / loop.js as v2.html; the look lives in themes/lobby.css, scoped to body.t-lobby. -->
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="themes/lobby.css">
</head>
<body class="t-lobby">
<header id="hud"></header>
<main>
  <div class="prog-wrap"><span class="prog-tag">ROUND</span><div class="prog" id="prog" role="img" aria-label="Question 1 of 10 in this round"></div></div>

  <section class="board" id="board">
    <div class="board-rail" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="meta">
        <span class="chip" id="qn">Q1</span><span class="chip real" id="kind">REAL</span>
        <span class="tries" id="tries" aria-label="Tries"></span>
        <button class="bulb" id="bulb" type="button" aria-expanded="false" aria-controls="twin" aria-label="Show a worked twin">
          <img src="icons/light_bulb_color.svg" alt="" draggable="false"><span class="n">1</span>
        </button>
      </div>
      <div class="reelwin">
        <span class="pay pay-l" aria-hidden="true"></span>
        <div class="q" id="q">1 + 1 = ?</div>
        <span class="pay pay-r" aria-hidden="true"></span>
      </div>
      <div class="twin" id="twin" hidden></div>
      <p class="how">Pick one. Then hit CHECK.</p>
      <div class="opts" id="opts" role="radiogroup" aria-label="Choices"></div>
  </section>

  <div class="go-row"><button class="go" id="go" type="button" disabled>CHECK</button></div>
  <div class="winplate"><span class="wp-tag" aria-hidden="true">WIN</span><p class="next-hint" id="hint" aria-live="polite"></p></div>
</main>
<footer id="dock"></footer>
<script src="engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="fx.js"></script>
<script src="loop.js"></script>
</body>
</html>
