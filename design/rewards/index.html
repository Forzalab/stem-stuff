<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sugar Rewards Mock</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Press+Start+2P&display=swap">
<!-- Sugar-mode reward loop mock (design/REWARDS.md). engine.js + hud.css = rewards engine and HUD; fx.js + fx.css = pops, reels, bursts. -->
<style>
:root {
  --bg0: #12062b; --bg1: #2a0b5e; --violet: #7b3fe4; --magenta: #d63fa8;
  --orange: #ff8a1f; --orange2: #ffb347; --gold: #ffd36b; --gold-dk: #b9791f;
  --ink: #fff7ec; --muted: #cdb8f5; --ok: #3ddc84; --bad: #ff5a6e; --panel: rgb(40 12 90 / .85);
  --f-display: "Lilita One", system-ui, sans-serif; --f-pixel: "Press Start 2P", monospace; --f-body: "Nunito", system-ui, sans-serif;
}
/* casino look is dark in both schemes */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg0); color: var(--ink); font-family: var(--f-body); overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
/* purple glow floor + faint tile grid */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 55% at 50% 38%, rgb(214 63 168 / .35), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 100%, var(--bg1), transparent 70%),
    linear-gradient(rgb(255 255 255 / .035) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, rgb(255 255 255 / .035) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--bg0);
}
main { max-width: 560px; margin: 0 auto; padding: 92px 16px calc(96px + env(safe-area-inset-bottom)); }

/* the question board: gold bevel frame */
.board {
  position: relative; border-radius: 22px; padding: 4px;
  background: linear-gradient(180deg, var(--gold), var(--orange) 45%, var(--gold-dk));
  box-shadow: 0 18px 40px -10px rgb(0 0 0 / .7), 0 0 40px rgb(255 138 31 / .25);
}
.board-in {
  border-radius: 18px; padding: 18px 16px 20px;
  background: radial-gradient(ellipse 100% 70% at 50% 0%, #4a1aa0, #22094f 70%);
  box-shadow: inset 0 2px 0 rgb(255 255 255 / .18), inset 0 -6px 18px rgb(0 0 0 / .45);
}
.board.in { animation: slideIn .32s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes slideIn { from { transform: translateX(40px) scale(.96); opacity: 0; } }
.meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.chip {
  font-family: var(--f-display); font-size: .95rem; letter-spacing: .02em; padding: 4px 12px; border-radius: 999px;
  background: rgb(0 0 0 / .35); border: 1.5px solid var(--gold); color: var(--gold);
}
.chip.snack { background: linear-gradient(180deg, var(--orange2), var(--orange)); color: #3a1300; border-color: #ffe0a8; }
.chip.real { background: linear-gradient(180deg, #9b6bff, var(--violet)); color: #fff; border-color: #d8c6ff; }
.tries { margin-left: auto; display: flex; gap: 5px; }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.tries i.used { background: transparent; border: 2px solid rgb(255 211 107 / .5); box-shadow: none; }
.q {
  font-family: var(--f-display); font-size: clamp(2.2rem, 11vw, 3.4rem); line-height: 1.05; text-align: center;
  margin: 8px 0 18px; text-shadow: 0 3px 0 rgb(0 0 0 / .45), 0 0 24px rgb(214 63 168 / .5);
}
.how { text-align: center; color: var(--muted); font-weight: 800; margin: -8px 0 14px; font-size: .95rem; }

/* candy pills, a–e */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 14px 8px 8px;
  font: 800 1.35rem var(--f-body); color: #2a0b5e; text-align: left; cursor: pointer;
  border: 0; border-radius: 999px; background: linear-gradient(180deg, #fff, #e9defc);
  box-shadow: 0 4px 0 #9a7fd6, 0 8px 16px -6px rgb(0 0 0 / .6), inset 0 2px 0 #fff;
  transition: transform .08s;
}
.opt:last-child:nth-child(odd) { grid-column: 1 / -1; }
.opt:active { transform: translateY(2px); }
.opt .l {
  flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  font: 1.1rem var(--f-display); color: #fff; background: linear-gradient(180deg, #9b6bff, var(--violet));
  box-shadow: inset 0 2px 0 rgb(255 255 255 / .35);
}
.opt[aria-checked="true"] { background: linear-gradient(180deg, #fff27a, #ffd21f); box-shadow: 0 4px 0 #c79a00, 0 0 0 3px #fff6b0, 0 8px 18px -6px rgb(255 210 31 / .7); }
.opt[aria-checked="true"] .l { background: linear-gradient(180deg, var(--orange2), var(--orange)); }
.opt.right { background: linear-gradient(180deg, #8dffbf, var(--ok)); box-shadow: 0 4px 0 #1d9a55, 0 0 0 3px #d4ffe6, 0 0 26px rgb(61 220 132 / .7); }
.opt.right .l { background: #1d9a55; }
.opt.wrong { opacity: .55; text-decoration: line-through; text-decoration-thickness: 3px; background: linear-gradient(180deg, #ffd0d6, #f2a3ad); box-shadow: 0 2px 0 #b5525e; cursor: default; }
.opt.wrong .l { background: var(--bad); }
.opt.reveal { outline: 3px dashed var(--ok); outline-offset: 3px; }

/* big round green SPIN-style check button */
.go-row { display: flex; justify-content: center; margin-top: 20px; }
.go {
  width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer;
  font: 1.9rem var(--f-display); color: #fff; letter-spacing: .03em; text-shadow: 0 3px 0 #0d6b35;
  background: radial-gradient(circle at 50% 30%, #9dffb9, #2fcf6a 55%, #138a42);
  box-shadow: 0 0 0 5px var(--gold), 0 0 0 8px var(--gold-dk), 0 10px 0 6px #0d5a2c, 0 18px 34px rgb(0 0 0 / .6), inset 0 4px 0 rgb(255 255 255 / .5);
  transition: transform .1s, filter .2s;
}
.go:active:not(:disabled) { transform: translateY(5px); }
.go:disabled { filter: grayscale(.85) brightness(.7); cursor: default; }
.go small { display: block; font: 800 .7rem var(--f-body); letter-spacing: .1em; text-shadow: none; opacity: .9; }
.next-hint { text-align: center; color: var(--muted); margin-top: 14px; font-weight: 800; min-height: 1.4em; }
@media (prefers-reduced-motion: reduce) { .board.in { animation: none; } }
</style>
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="fx.css">
</head>
<body>
<header id="hud"></header>
<main>
  <section class="board" id="board">
    <div class="board-in">
      <div class="meta"><span class="chip" id="qn">Q1</span><span class="chip real" id="kind">REAL</span><span class="tries" id="tries"></span></div>
      <div class="q" id="q">1 + 1 = ?</div>
      <p class="how">Pick one. Then hit CHECK.</p>
      <div class="opts" id="opts" role="radiogroup" aria-label="Choices"></div>
    </div>
  </section>
  <div class="go-row"><button class="go" id="go" type="button" disabled>CHECK<small>TAP TO SPIN</small></button></div>
  <p class="next-hint" id="hint" aria-live="polite"></p>
</main>
<footer id="dock"></footer>
<script src="engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="fx.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s), L = "abcde";
  const R = window.Rewards, FX = window.FX || {};
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const shuffle = xs => { for (let i = xs.length - 1; i > 0; i--) { const j = ri(0, i); [xs[i], xs[j]] = [xs[j], xs[i]]; } return xs; };

  /* a question: snack = one-digit sum, real = a bit more. Distractors = real slips: off by one, product, digits glued. */
  function make(kind, first) {
    let a, b;
    if (first) [a, b] = [1, 1];
    else if (kind === "snack") [a, b] = [ri(1, 9), ri(1, 9)];
    else [a, b] = [ri(12, 49), ri(3, 9)];
    const ans = a + b, set = new Set([ans]);
    for (const d of [ans + 1, ans - 1, a * b, +("" + a + b), ans + 10, ans - 10, ans + 2]) if (set.size < 5 && d >= 0) set.add(d);
    return { kind, text: `${a} + ${b} = ?`, ans, choices: shuffle([...set]) };
  }

  let n = 0, cur = null, pick = null, tries = 0, shown = 0, busy = false, nextT = 0;
  function open() {
    clearTimeout(nextT);
    const kind = n === 0 ? "real" : R ? R.nextKind() : "real";
    cur = make(kind, n === 0); n++; pick = null; tries = 0; busy = false; shown = Date.now();
    $("#qn").textContent = `Q${n}`;
    const k = $("#kind"); k.textContent = kind === "snack" ? "SNACK" : "REAL"; k.className = `chip ${kind}`;
    $("#q").textContent = cur.text; $("#hint").textContent = "";
    $("#opts").innerHTML = cur.choices.map((c, i) =>
      `<button class="opt" type="button" role="radio" aria-checked="false" data-v="${c}"><span class="l">${L[i]}</span>${c}</button>`).join("");
    paintTries(); $("#go").disabled = true;
    const b = $("#board"); b.classList.remove("in"); void b.offsetWidth; b.classList.add("in");
  }
  const paintTries = () => { $("#tries").innerHTML = [0, 1].map(i => `<i class="${i < tries ? "used" : ""}"></i>`).join(""); };

  $("#opts").addEventListener("click", e => {
    const o = e.target.closest(".opt"); if (!o || o.disabled || busy) return;
    for (const x of document.querySelectorAll(".opt")) x.setAttribute("aria-checked", x === o);
    pick = o; $("#go").disabled = false;
  });

  async function check() {
    if (!pick || busy) return;
    busy = true; $("#go").disabled = true;
    const ok = +pick.dataset.v === cur.ans, firstTry = tries === 0, el = pick;
    tries++; paintTries();
    if (!ok) {                                   // quiet: no sound, no shake, no shame text
      el.classList.add("wrong"); el.disabled = true; el.setAttribute("aria-checked", "false"); pick = null;
      R && R.answer({ correct: false, firstTry, snack: cur.kind === "snack", dwellMs: Date.now() - shown });
      R && R.render(0);
      if (tries < 2) { $("#hint").textContent = "One more try."; busy = false; return; }
      const r = [...document.querySelectorAll(".opt")].find(x => +x.dataset.v === cur.ans); r && r.classList.add("reveal");
      $("#hint").textContent = `It was ${cur.ans}. Next one.`;
      return later(1600);
    }
    el.classList.add("right");
    FX.pop && FX.pop(el);
    FX.sparks && FX.sparks(el, cur.kind === "snack" ? "small" : "medium");
    const r = R ? R.answer({ correct: true, firstTry, snack: cur.kind === "snack", dwellMs: Date.now() - shown }) : { xp: 0 };
    if (r.xp && FX.coinFly) FX.coinFly(el, $("#coinPill"), Math.min(8, Math.max(2, Math.round(r.xp / 2))));
    R && setTimeout(() => R.render(r.xp), 450);
    $("#hint").textContent = r.xp ? `+${r.xp} XP` : "Correct. No XP on try 2.";
    await reveal(r);
    later(r.drop || r.levelUp ? 500 : 1200);
  }
  async function reveal(r) {
    if (r.drop && FX.slots) await FX.slots(r.drop);
    if (r.burst && FX.burst) {
      const opt = r.burst === "levelup" ? { title: "LEVEL UP", sub: `LEVEL ${r.level}` }
        : r.burst === "legend" ? { title: r.line, sub: "+50 XP" } : { title: "BONUS LEVEL", sub: r.sub || r.line };
      await FX.burst(r.burst, opt);
    }
    if (r.toast && FX.toast) FX.toast(r.line, r.sub || r.streakNote);
    else if (!r.drop && r.streakNote && FX.toast) FX.toast(r.streakNote);
  }
  function later(ms) { $("#hint").textContent += "  (tap to skip)"; nextT = setTimeout(open, ms); }

  $("#go").addEventListener("click", check);
  $("#hint").addEventListener("click", () => { if (nextT && busy) open(); });
  $("#board").addEventListener("click", () => { if (busy && nextT) open(); });

  R && R.mountHUD($("#hud"), $("#dock"));
  R && R.render(0);
  open();
})();
</script>
</body>
</html>
