<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizpop Rewards Mock</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<!-- Rewards mock, variant "quizpop": bright friendly quiz app. Shared: engine.js + hud.css (HUD), fx.js + fx.css (rewards FX), loop.js (question loop + DOM contract).
     Theme: themes/quizpop.css. Icons: Microsoft Fluent Emoji Color (MIT), icons/. -->
<!-- impeccable-disable gradient-text: the LEVEL UP gradient lives in shared fx.css (lead-owned); quizpop overrides .fx-title to a solid sun fill -->
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="themes/quizpop.css">
</head>
<body class="t-quizpop">
<header id="hud"></header>
<main>
  <section class="card" aria-label="Quiz">
    <div class="prog" id="prog" role="img" aria-label="Question 1 of 10 in this round"></div>
    <div class="board" id="board">
      <div class="meta">
        <span class="chip" id="qn">Q1</span><span class="chip real" id="kind">REAL</span>
        <span class="tries" id="tries" aria-label="Two tries"></span>
        <img class="mascot" src="icons/duck_color.svg" alt="" draggable="false">
      </div>
      <h1 class="q" id="q">1 + 1 = ?</h1>
      <p class="how">Choose your answer</p>
      <div class="opts" id="opts" role="radiogroup" aria-label="Choices"></div>
      <div class="twin" id="twin" hidden></div>
    </div>
    <div class="acts">
      <button class="bulb" id="bulb" type="button" aria-expanded="false" aria-controls="twin" aria-label="Hint: show a worked twin">
        <img src="icons/light_bulb_color.svg" alt="" draggable="false"><span class="n" aria-hidden="true">1</span>
      </button>
      <button class="go" id="go" type="button" disabled>CHECK</button>
    </div>
  </section>
  <p class="next-hint" id="hint" aria-live="polite"></p>
</main>
<footer id="dock"></footer>
<script src="engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="fx.js"></script>
<script src="loop.js"></script>
</body>
</html>
