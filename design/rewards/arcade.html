<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade Rewards Mock</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Press+Start+2P&display=swap">
<!-- impeccable-disable gradient-text: LEVEL UP title lives in shared fx.css (Tony's pixel ref), burst overlay only, 1.2 s -->
<!-- impeccable-disable radial-halo: shared fx.css burst/duck glow, only inside the 1.2-2 s burst overlay, never on the resting page -->
<!-- Sugar-mode reward loop, variant "arcade": chunky mobile-game kit (navy floor, glossy multi-hue pills, ribbon panel).
     Shared: engine.js + hud.css (HUD), fx.js + fx.css (pops, reels, bursts), loop.js (question loop + DOM contract).
     Look: themes/arcade.css, scoped under body.t-arcade. Icons: Microsoft Fluent Emoji Color (MIT), icons/. -->
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="themes/arcade.css">
</head>
<body class="t-arcade">
<header id="hud"></header>
<main>
  <div class="prog" id="prog" role="img" aria-label="Question 1 of 10 in this round"></div>
  <section class="board" id="board" aria-labelledby="qn">
    <h2 class="ribbon"><span class="ribbon-band" id="qn">Q1</span></h2>
    <div class="meta">
      <span class="chip real" id="kind">REAL</span>
      <span class="tries" id="tries" aria-label="Two tries"></span>
      <button class="bulb" id="bulb" type="button" aria-expanded="false" aria-controls="twin" aria-label="Show a worked twin (pays 2 XP)">
        <img src="icons/light_bulb_color.svg" alt="" draggable="false"><span class="n" aria-hidden="true">1</span>
      </button>
    </div>
    <div class="q" id="q">1 + 1 = ?</div>
    <div class="twin" id="twin" hidden></div>
    <p class="how">Pick one, then hit CHECK.</p>
    <div class="opts" id="opts" role="radiogroup" aria-label="Choices"></div>
  </section>
  <div class="go-row"><button class="go" id="go" type="button" disabled>CHECK</button></div>
  <p class="next-hint" id="hint" aria-live="polite"></p>
</main>
<footer id="dock"></footer>
<script src="engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="fx.js"></script>
<script src="loop.js"></script>
</body>
</html>
