<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" aria-hidden="true" focusable="false">
<style>
.f{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
*{transform-box:fill-box;transform-origin:center}
.g{animation:g 5s ease-in-out infinite}
.t2{animation:t2 5s ease-out infinite}
.mk{animation:mk 5s ease-out infinite}
.far{opacity:.62;animation:far 5s ease infinite}
.keep rect{stroke:#ff9a3e;animation:keep 5s ease infinite}
.st{stroke-dasharray:20;animation:st 5s ease-in-out infinite}
.s2{animation-name:s2}
@keyframes g{0%{opacity:0}4%,94%{opacity:1}100%{opacity:0}}
@keyframes t2{0%,14%{opacity:0;transform:translateX(-8px)}26%,100%{opacity:1;transform:none}}
@keyframes mk{0%,30%{opacity:0}42%,100%{opacity:1}}
@keyframes far{0%,52%{opacity:1}64%,100%{opacity:.62}}
@keyframes keep{0%,48%{stroke:#a9b8cc}58%,100%{stroke:#ff9a3e}}
@keyframes st{0%,54%{stroke-dashoffset:20}66%,100%{stroke-dashoffset:0}}
@keyframes s2{0%,60%{stroke-dashoffset:20}72%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="g">
<text class="f" x="50" y="26" font-size="15" fill="#a9b8cc" text-anchor="middle">4.9 × 9.8</text>
<path d="M92 17l6 6-6 6" fill="none" stroke="#5e7899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="f t2" x="148" y="26" font-size="15" fill="#ff9a3e" text-anchor="middle">5 × 10 ≈ 50</text>
<g class="mk"><path d="M148 36C148 60 100 52 100 76" fill="none" stroke="#ff9a3e" stroke-width="1.5" stroke-dasharray="2 3"/><path d="M94 74h12l-6 8z" fill="#ff9a3e"/></g>
<g class="far"><rect x="14" y="88" width="44" height="22" rx="11" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text class="f" x="36.0" y="103" font-size="11" fill="#f3f7fc" text-anchor="middle">4.8</text></g><g class="keep"><rect x="78" y="88" width="44" height="22" rx="11" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text class="f" x="100.0" y="103" font-size="11" fill="#f3f7fc" text-anchor="middle">48</text></g><g class="far"><rect x="142" y="88" width="44" height="22" rx="11" fill="#0b1422" stroke="#a9b8cc" stroke-width="1.5"/><text class="f" x="164.0" y="103" font-size="11" fill="#f3f7fc" text-anchor="middle">480</text></g>
<path class="st" d="M20 108l32-18" pathLength="20" stroke="#ff9a3e" stroke-width="2.2" stroke-linecap="round"/>
<path class="st s2" d="M148 108l32-18" pathLength="20" stroke="#ff9a3e" stroke-width="2.2" stroke-linecap="round"/>
</g>
</svg>
