     No text. Colors are the app.css dark tokens (--paper --sheet --c1 --ink), copied here because app.css is not loaded yet. -->
<style>
html { background: #050c16; color: #e8edf5; }   /* --page, --ink */
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #050c16; transition: opacity .2s ease-out; }
#splash.out { opacity: 0; pointer-events: none; }
#splash svg { display: block; width: 64px; height: 64px; }
#splash .sp-tile { fill: #101c2c; }   /* --card */
#splash .sp-curve { fill: none; stroke: #92c0ff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1 1.1; animation: sp-draw 2.2s infinite; }   /* --action */
#splash .sp-dot { fill: #e8edf5; transform-box: fill-box; transform-origin: center; animation: sp-dot 2.2s infinite; }   /* --ink */
@keyframes sp-draw {
  0% { stroke-dashoffset: 1.05; animation-timing-function: cubic-bezier(.3, 0, .2, 1); }
  32%, 74% { stroke-dashoffset: 0; animation-timing-function: cubic-bezier(.5, 0, .75, 0); }
  92%, 100% { stroke-dashoffset: -1.05; }
}
@keyframes sp-dot {
  0%, 20% { transform: scale(0); animation-timing-function: cubic-bezier(.25, 1, .5, 1); }
  34%, 74% { transform: scale(1); animation-timing-function: cubic-bezier(.5, 0, .75, 0); }
  86%, 100% { transform: scale(0); }
}
@media (prefers-reduced-motion: reduce) {
  #splash { transition: none; }
  #splash .sp-curve, #splash .sp-dot { animation: none; }
}
</style>

<script>
/* Splash: shown at least 300 ms, gone when fonts, KaTeX (the page load), the saved-bank restore (stemOffline.ready) and the #CODE problem (stemFirst) are done,
   never later than 4 s. Fades out in 200 ms; with reduced motion it just goes. A bfcache restore never shows it. */
(function () {
  var el = document.getElementById("splash"), t0 = performance.now(), over = false;
  if (!el) return;
  document.body.setAttribute("aria-busy", "true");
  var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function end(now) {
    if (over) return; over = true;
    document.body.removeAttribute("aria-busy");
    if (now || still) { el.remove(); return; }
    el.classList.add("out");
    setTimeout(function () { el.remove(); }, 220);
  }
  addEventListener("pageshow", function (e) { if (e.persisted) end(true); });
  setTimeout(end, 4000);
  var loaded = document.readyState === "complete" ? Promise.resolve() : new Promise(function (r) { addEventListener("load", r, { once: true }); });
  function fonts() {
    var f = ['400 1em "Atkinson Hyperlegible"', '700 1em "Atkinson Hyperlegible"', '700 1em "Atkinson Hyperlegible Mono"'];
    return document.fonts ? Promise.all(f.map(function (x) { return document.fonts.load(x); })) : 0;
  }
  function frame() { return new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); }); }   // the opened problem has painted
  function first() { return window.stemFirst && window.stemFirst.then(frame); }   // app.js: the #CODE problem opened (or failed)
  loaded.then(function () { return Promise.all([fonts(), window.stemOffline && window.stemOffline.ready, first()]); }).catch(function () {}).then(function () {
    setTimeout(end, Math.max(0, 300 - (performance.now() - t0)));
  });
})();
</script>

    <button type="button" class="pstrip" id="pstrip" aria-label="Show question" hidden><span id="pstripCode"></span></button>
    <!-- side by side: the question's label row, the twin of the pad's "Scratchpad" row, so both boxes start at the same height (Tony, Oct 3) -->
    <div class="xb-label q-label" aria-hidden="true"><svg class="ico" aria-hidden="true"><use href="#i-doc"/></svg><span>Question</span></div>
    <div class="freeze-in" id="freezeIn">
      <article class="p" id="problem">
        <h1 class="pcode sr-only" id="pcode"></h1>
        <p class="rtag" id="rtag" role="status" hidden></p>
        <div class="blocks" id="blocks"></div>
      </article>
      <div class="q" id="q"></div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
    <!-- grab handle on the strip's bottom edge (Tony: variant A): tap or drag down opens the whole problem, tap or drag up folds it -->
    <button type="button" class="more" id="more" aria-expanded="false" aria-controls="freezeIn" aria-label="Show whole question" hidden></button>
  </section>

  <!-- the one drag handle in the gap between the problem and the pad (M3 pane expansion): drag snaps to an anchor, a tap goes to the next -->
  <div class="sash" id="sash" role="separator" tabindex="0" aria-controls="freeze" hidden></div>
  <section class="work" id="work" hidden>
    <div class="xb" id="xb">
      <div class="xb-label" id="xbLabel"><svg class="ico" aria-hidden="true"><use href="#i-pen"/></svg><span id="xbName">Notes</span><span class="xb-save" id="xbSave" role="status"></span>
      </div>   <!-- not a <label>: tapping it must not refocus the box (it kept the keyboard up) -->
      <!-- the textarea (#scratch) is (re)created per problem, before the button, so edit history starts fresh.
           Copy sits inside the box's bottom-right corner, shown only when the box has text (C10); ExplainBox.reserveCorner keeps text out from under it. -->
      <div class="xb-field" id="xbField">
        <button type="button" class="btn xb-copy" id="copy" aria-label="Copy my work for Tony" title="Copy my work for Tony" hidden>
          <svg class="ico" aria-hidden="true"><use href="#i-copy"/></svg>
        </button>
        <!-- the pad page's tool row (round 3d, variant 3): the q | a switch at the left, collapse left of Copy. Both belong to the pad, so they
             live in its box, in thumb reach. q = the problem in the tile, a = the answer (KaTeX math italic letters, STYLE.md §2.2) -->
        <button type="button" class="btn btn-tgl mt-mode" id="mtMode" data-pane="problem" aria-label="Show answer" hidden>
          <span class="qa-l t-doc" aria-hidden="true">q</span><span class="qa-l t-pen" aria-hidden="true">a</span>
        </button>
        <button type="button" class="btn mt-exp" id="mtExp" aria-label="Close notes" title="Close notes" hidden><svg class="ico" aria-hidden="true"><use href="#i-collapse"/></svg></button>
      </div>
    </div>
  </section>
  </div>
  <!-- keyboard up, problem pane: a one-line glimpse of the pad just above the keyboard; a tap goes to the pad in the same tap -->
  <div class="pad-peek" id="padPeek" role="button" aria-label="Go to notes" hidden><svg class="ico" aria-hidden="true"><use href="#i-pen"/></svg><span id="padPeekTx">Notes</span></div>
</main>
<!-- phones: the pad is hidden; this floating button opens the pad page. Drag it: it snaps to a side edge (STYLE.md §3) -->
<button type="button" class="pad-fab" id="padFab" aria-controls="work" aria-expanded="false" hidden><svg class="ico" aria-hidden="true"><use href="#i-pen"/></svg><span>Open notes</span></button>
<div id="toast" role="status" aria-live="polite"></div>
<p class="sr-only" id="sr" aria-live="polite"></p>
<small id="ver" aria-hidden="true"></small>
<!-- footer: the privacy note, left of the dev tag (#ver). Quiet like it (--hint, smallest type); a real link, keyboard + screen reader reachable. z 21: over the phone dock (20, the whole window on the start page), under the notes button (40) and Cluck (45) -->
<style>
#privacy { position: fixed; z-index: 21; right: calc(max(var(--s2), env(safe-area-inset-right)) + 2.6em); bottom: max(0px, env(safe-area-inset-bottom));
  display: inline-flex; align-items: flex-end; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 var(--s1) var(--s1);   /* a 44px target, the text on #ver's baseline */
  color: var(--hint); font-size: var(--t-xs); line-height: 1; text-decoration: underline; text-underline-offset: 2px; }
#privacy:hover, #privacy:focus-visible { color: var(--muted); }
.dock-bottom:not(.start):not(.ql-open) #privacy { display: none; }   /* phones over a question: the bottom belongs to the bar, the notes button and Swap; the start page shows it */
html.bar-open:not(.ql-open) #privacy { visibility: hidden; }
/* G3 (an opt-out reachable mid-question on a phone, 2 taps): it comes back with the question list (list button, then this), right under
   the list's bottom-right corner (nav.js sets --ql-bottom), in the dimmed gap above the code bar, over the dim (46). Covers nothing. */
html.dock-bottom.ql-open:not(.start) #privacy { z-index: 48; top: var(--ql-bottom, 50svh); bottom: auto; right: var(--gut); align-items: flex-start; padding: var(--s2) var(--s1) 0; }
#privacy::after { content: "privacy"; }   /* drawn by CSS like #ver: not page text, never in a copy or a text check */
#cluck .cl-verify::after { content: ", and pls no private shit in it xoxo"; }   /* D20: next to Cluck's "verify b4 use lol" */
</style>
<a id="privacy" href="privacy.html" aria-label="Privacy"></a>
</body>
</html>
