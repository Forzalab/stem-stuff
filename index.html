<!-- Loading splash = a skeleton of the real page (SKELETON-SPLASH): static markup + this CSS are inline so it paints before any file loads. No text.
     The blocks are MEASURED from the real v7 page with the vendored auto-skeleton core (client/vendor/auto-skeleton.js) by tools/build_and_ship/splash_skeleton.mjs,
     which rewrites everything between the SK markers: do not hand-edit. Colours: --float rest, a dim --dawn sweep, --card card (no sweep), Cluck brown pane with warm bars. -->
<style>
html { background: #02060c; color: #f3f7fc; }   /* --page, --ink */
/* SK:css:start */
.auto-skeleton {position: relative; display: block; width: 100%; overflow: hidden; contain: layout style paint; --_c: var(--auto-skeleton-color, rgba(128, 128, 128, 0.18)); --_h: var(--auto-skeleton-highlight, rgba(128, 128, 128, 0.34));} .auto-skeleton__block {position: absolute; overflow: hidden; pointer-events: none; background-color: var(--_c);} .auto-skeleton[data-animate="true"] .auto-skeleton__block::after {content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--_x) * -1); width: var(--auto-skeleton-w); background: linear-gradient(90deg, transparent 0%, var(--_h) 50%, transparent 100%); transform: translateX(-100%); animation: auto-skeleton-sweep var(--auto-skeleton-duration, 1.6s) linear infinite;} @keyframes auto-skeleton-sweep {to {transform: translateX(100%);}} .auto-skeleton--fading {opacity: 0; transition: opacity var(--auto-skeleton-fade, 200ms) ease-out;} @media (prefers-reduced-motion: reduce) {.auto-skeleton[data-animate="true"] .auto-skeleton__block::after {animation: none; content: none;}}
#splash { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #02040d; transition: opacity .2s ease-out;
  --auto-skeleton-color: #141d36; --auto-skeleton-highlight: #29385e; --auto-skeleton-duration: 2s; }   /* --float rest, a dim dawn sweep, 2 s */
#splash.out { opacity: 0; pointer-events: none; }
#splash .sk { display: none; width: 390px; height: 100%; transform-origin: 0 0; animation: sk-in .12s ease-out .12s both; }   /* the first 120 ms stay plain page, then it fades in */
#splash .sk[data-b="phone"] { width: 390px; } #splash .sk[data-b="tablet"] { width: 768px; } #splash .sk[data-b="desk"] { width: 1280px; }
@media (max-width: 600px) { #splash .sk[data-b="phone"] { display: block; } }
@media (min-width: 601px) and (max-width: 1099px) { #splash .sk[data-b="tablet"] { display: block; } }
@media (min-width: 1100px) { #splash .sk[data-b="desk"] { display: block; } }
#splash .sk-card { background-color: #0d142a; } #splash .sk-pane { background-color: rgb(22,17,13); } #splash .sk-field { background-color: rgb(14,10,7); }   /* --card; the Cluck panel's own brown */
#splash .sk-warm { background-color: rgb(42,33,26); --_h: rgb(58,46,36); }   /* warm bars on the brown: no blue on brown */
#splash .sk-card::after, #splash .sk-pane::after, #splash .sk-field::after { display: none !important; }
@keyframes sk-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #splash { transition: none; } #splash .sk { animation: none; } }
/* SK:css:end */
</style>

    <symbol id="i-tri" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <!-- multitask (docs/design/MULTITASK.md): open the pad as its own page / close it again -->
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M21 3l-7 7M3 21l7-7M9 21H3v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><!-- Lucide "maximize-2" (ISC): open the pad as a page -->
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M14 10l7-7M20 10h-6V4M3 21l7-7M4 14h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><!-- Lucide "minimize-2" (ISC): close the pad page -->
    <!-- Cluck the duck -->
    <symbol id="i-sigma" viewBox="0 0 24 24"><path d="M18 5H6l6 7-6 7h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><!-- KEYF-V7: the Key formulas box's rail mark (brain hintbox/v71 kit.js I.sig) -->
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><!-- Lucide "lightbulb" (ISC): key formulas -->
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12l7-7 7 7M12 19V5" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></symbol><!-- Lucide "arrow-up" (ISC): Cluck send; our 2.25 stroke kept -->
    <symbol id="i-duck" viewBox="0 0 24 24"><path d="M9 4.5a4 4 0 0 1 4 4c0 1-.3 1.8-.8 2.5H17c1.5 0 2.7-.8 3.3-2 .8 1 1.2 2.3 1.2 3.7 0 4-3.4 6.8-8 6.8H9c-3.3 0-5.5-2.2-5.5-5 0-1.8 1-3.3 2.4-4.2A4 4 0 0 1 9 4.5z" fill="currentColor"/><path d="M12.8 7.8l3.4.9-3.4.9z" fill="var(--c2)"/><circle cx="9.8" cy="7.9" r="1" fill="var(--paper)"/></symbol>
    <!-- i-duck-line: FILLED since Tony Nov 20 (pick C; id kept: cluckbtn.js + ick5 smoke). Body = currentColor, eye = a hole (mask), so whatever sits behind shows through -->
    <symbol id="i-duck-line" viewBox="0 0 24 24"><mask id="i-duck-eye" maskUnits="userSpaceOnUse" x="-2" y="-2" width="28" height="28"><rect x="-2" y="-2" width="28" height="28" fill="#fff"/><circle cx="9" cy="7" r="1.2" fill="#000"/></mask><g mask="url(#i-duck-eye)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="currentColor" d="M12.6 11a4.2 4.2 0 1 0-6.9-.9C4.1 11 3 12.7 3 14.7 3 17.7 5.4 20 8.6 20H14c4 0 7-2.6 7-6.2 0-1.3-.4-2.5-1-3.4-.7 1-1.8 1.6-3.2 1.6z"/><path d="M13.6 6.6l2.9.9-2.9 1.1"/></g></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol><!-- Lucide "message-square" (ISC): the Explain label -->
    <symbol id="i-me" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5" fill="currentColor"/><path d="M5 19.5a7 7 0 0 1 14 0z" fill="currentColor"/></symbol>
  </defs>
</svg>

<header class="top">
  <!-- the entry box: top of the column on desktop, fixed bottom-centre on phones (one thumb) -->
  <div class="dock" id="dock">
    <!-- phones, problem open: the bar rests as a short strip (up-chevron); tap or swipe up shows it over the page, tap or swipe down puts it away -->
    <button type="button" class="bar-tab" id="barTab" aria-expanded="false" aria-controls="entry" aria-label="Show code box"><svg class="ico" aria-hidden="true"><use href="#i-down"/></svg></button>
    <!-- start page (html.start: no problem open): one line of title over the entry, both centred (app.css) -->
    <h1 class="start-title" id="startTitle">Type a code to start.</h1>
    <form class="entry" id="entry" autocomplete="off" novalidate>
      <button type="button" class="btn" id="upload" aria-label="Open file" title="Open file">
        <svg class="ico" aria-hidden="true"><use href="#i-up"/></svg>
      </button>
      <div class="code-box">
        <!-- no name: the browser's own form history stays out; app.js shows its own suggestions (suggest.mjs: banks first) -->
        <input id="code" type="text" aria-label="Type code here" aria-describedby="entryMsg" placeholder="e.g. CALC1_E01"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="codeSug" autocomplete="off"
          maxlength="24" spellcheck="false" autocapitalize="characters" autocorrect="off" enterkeyhint="go">
        <ul class="code-sug" id="codeSug" role="listbox" aria-label="Matching codes" hidden></ul>
        <button type="button" class="btn" id="codePaste" aria-label="Paste code" title="Paste code"><svg class="ico" aria-hidden="true"><use href="#i-paste"/></svg></button>
        <button type="submit" class="btn btn-go" id="codeGo" aria-label="Open question" hidden><svg class="ico" aria-hidden="true"><use href="#i-go"/></svg></button>
      </div>
      <button type="button" class="btn" id="retryLoad" aria-label="Try again" title="Try again" hidden><svg class="ico" aria-hidden="true"><use href="#i-retry"/></svg></button>
    </form>
    <button type="button" class="btn btn-label code-chip" id="codeChip" aria-label="Change code"><svg class="ico" aria-hidden="true"><use href="#i-pen"/></svg><span id="codeChipTx"></span></button>
    <p class="entry-msg" id="entryMsg" role="status" aria-live="polite"></p>
  </div>
  <!-- question nav (docs/design/NAV.md): only with a list (a practice bank, docs/design/BANK.md, or an uploaded problems.json). Top bar on phones, beside the entry box on desktop.
       The list opens in the flow under it (it pushes the problem down; nothing is covered). -->
  <nav class="qnav" id="qnav" aria-label="Questions" hidden>
    <button type="button" class="btn" id="qback" aria-label="Back" title="Back" hidden><svg class="ico" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
    <button type="button" class="btn btn-label" id="qlistBtn" aria-expanded="false" aria-controls="qlist">
      <svg class="ico" aria-hidden="true"><use href="#i-list"/></svg><span id="qlistName"></span>
    </button>
    <button type="button" class="btn" id="qprev" aria-label="Go back one" title="Go back one">
      <svg class="ico" aria-hidden="true"><use href="#i-prev"/></svg>
    </button>
    <button type="button" class="btn" id="qnext" aria-label="Next question" title="Next question">
      <svg class="ico" aria-hidden="true"><use href="#i-next"/></svg>
    </button>
  </nav>
  <div class="qlist" id="qlist" hidden>
    <!-- the front bank only (serve.py FRONT, DESIGN-v3 §1): the order is ours (noob) until the student mixes it up -->
    <div class="qmodes" id="qmodes" hidden>
      <button type="button" class="btn btn-label" id="qmix"><svg class="ico" id="qmixIco" aria-hidden="true"><use href="#i-shuffle"/></svg><span id="qmixTx">Shuffle</span></button>
      <button type="button" class="btn btn-label" id="qskip"><svg class="ico" aria-hidden="true"><use href="#i-skip"/></svg><span>Skip this question</span></button>
    </div>
    <ol></ol>
  </div>
</header>
<!-- the dim behind the open question list (nav.css); a tap on it is an outside tap, so it closes the list (nav.js) -->
<div class="ql-dim" id="qlDim" aria-hidden="true"></div>

<main id="main">
  <div id="sentinel" aria-hidden="true"></div>
  <!-- Swap (docs/design/SWAP.md): only while the phone keyboard is up. One icon toggle: document | pencil. -->
  <button type="button" class="btn btn-tgl" id="swap" data-pane="problem" aria-label="Show notes" hidden>
    <svg class="ico t-doc" aria-hidden="true"><use href="#i-doc"/></svg>
    <svg class="ico t-pen" aria-hidden="true"><use href="#i-pen"/></svg>
  </button>
  <!-- #stage is display:contents on the page as you know it; Swap turns it into the one-pane stage above the keyboard -->
  <div class="stage" id="stage">
  <section class="freeze" id="freeze" aria-labelledby="pcode" hidden>
    <!-- desktop, pad wide: the problem stashed to a 52px strip with its code written down the side; tap = the problem back -->
    <button type="button" class="pstrip" id="pstrip" aria-label="Show question" hidden><span id="pstripCode"></span></button>
    <!-- side by side: the question's label row, the twin of the pad's "Scratchpad" row, so both boxes start at the same height (Tony, Oct 3) -->
    <div class="xb-label q-label" aria-hidden="true"><svg class="ico" aria-hidden="true"><use href="#i-doc"/></svg><span>Question</span></div>
    <div class="freeze-in" id="freezeIn">
      <article class="p" id="problem">
        <h1 class="pcode sr-only" id="pcode"></h1>
        <p class="qtag rtag" id="rtag" role="status" hidden></p>
        <div class="blocks" id="blocks"></div>
      </article>
      <div class="q" id="q"></div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
    <!-- grab handle on the strip's bottom edge (Tony: variant A): tap or drag down opens the whole problem, tap or drag up folds it -->
    <button type="button" class="more" id="more" aria-expanded="false" aria-controls="freezeIn" aria-label="Show whole question" hidden></button>
  </section>

  <!-- the one drag handle in the gap between the problem and the pad (M3 pane expansion): drag snaps to an anchor, a tap goes to the next -->
  <div class="sash" id="sash" role="separator" tabindex="0" aria-controls="freeze" hidden></div>
  <section class="work" id="work" hidden>
    <div class="xb-label x-label" aria-hidden="true"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg><span>Explain</span></div>   <!-- EXPLAIN-TAG (Tony Nov 16): v7 side layout, level with "Question"; qcard.css shows it -->
    <div class="xb" id="xb">
      <div class="xb-label" id="xbLabel"><svg class="ico" aria-hidden="true"><use href="#i-pen"/></svg><span id="xbName">Notes</span><span class="xb-save" id="xbSave" role="status"></span>
      </div>   <!-- not a <label>: tapping it must not refocus the box (it kept the keyboard up) -->
      <!-- the textarea (#scratch) is (re)created per problem, before the button, so edit history starts fresh.
           Copy sits inside the box's bottom-right corner, shown only when the box has text (C10); ExplainBox.reserveCorner keeps text out from under it. -->
      <div class="xb-field" id="xbField">
        <button type="button" class="btn xb-copy" id="copy" aria-label="Copy my work for Tony" title="Copy my work for Tony" hidden>
          <svg class="ico" aria-hidden="true"><use href="#i-copy"/></svg>
        </button>
        <!-- the pad page's tool row (round 3d, variant 3): the q | a switch at the left, collapse left of Copy. Both belong to the pad, so they
             live in its box, in thumb reach. q = the problem in the tile, a = the answer (KaTeX math italic letters, STYLE.md §2.2) -->
        <button type="button" class="btn btn-tgl mt-mode" id="mtMode" data-pane="problem" aria-label="Show answer" hidden>
          <span class="qa-l t-doc" aria-hidden="true">q</span><span class="qa-l t-pen" aria-hidden="true">a</span>
        </button>
        <button type="button" class="btn mt-exp" id="mtExp" aria-label="Close notes" title="Close notes" hidden><svg class="ico" aria-hidden="true"><use href="#i-collapse"/></svg></button>
      </div>
    </div>
  </section>
  </div>
  <!-- keyboard up, problem pane: a one-line glimpse of the pad just above the keyboard; a tap goes to the pad in the same tap -->
  <div class="pad-peek" id="padPeek" role="button" aria-label="Go to notes" hidden><svg class="ico" aria-hidden="true"><use href="#i-pen"/></svg><span id="padPeekTx">Notes</span></div>
</main>
<!-- phones: the pad is hidden; this floating button opens the pad page. Drag it: it snaps to a side edge (STYLE.md §3) -->
<button type="button" class="pad-fab" id="padFab" aria-controls="work" aria-expanded="false" hidden><svg class="ico" aria-hidden="true"><use href="#i-pen"/></svg><span>Open notes</span></button>
<div id="toast" role="status" aria-live="polite"></div>
<p class="sr-only" id="sr" aria-live="polite"></p>
<small id="ver" aria-hidden="true"></small>
<!-- footer: the privacy note, left of the dev tag (#ver). Quiet like it (--hint, smallest type); a real link, keyboard + screen reader reachable. z 21: over the phone dock (20, the whole window on the start page), under the notes button (40) and Cluck (45) -->
<style>
#privacy { position: fixed; z-index: 21; right: calc(max(var(--s2), env(safe-area-inset-right)) + 2.6em); bottom: max(0px, env(safe-area-inset-bottom));
  display: inline-flex; align-items: flex-end; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 var(--s1) var(--s1);   /* a 44px target, the text on #ver's baseline */
  color: var(--hint); font-size: var(--t-xs); line-height: 1; text-decoration: underline; text-underline-offset: 2px; }
#privacy:hover, #privacy:focus-visible { color: var(--muted); }
.dock-bottom:not(.start):not(.ql-open) #privacy { display: none; }   /* phones over a question: the bottom belongs to the bar, the notes button and Swap; the start page shows it */
html.bar-open:not(.ql-open) #privacy { visibility: hidden; }
/* G3 (an opt-out reachable mid-question on a phone, 2 taps): it comes back with the question list (list button, then this), right under
   the list's bottom-right corner (nav.js sets --ql-bottom), in the dimmed gap above the code bar, over the dim (46). Covers nothing. */
html.dock-bottom.ql-open:not(.start) #privacy { z-index: 48; top: var(--ql-bottom, 50svh); bottom: auto; right: var(--gut); align-items: flex-start; padding: var(--s2) var(--s1) 0; }
#privacy::after { content: "privacy"; }   /* drawn by CSS like #ver: not page text, never in a copy or a text check */
#cluck .cl-verify::after { content: ", and pls no private shit in it xoxo"; }   /* D20: next to Cluck's "verify b4 use lol" */
</style>
<a id="privacy" href="privacy.html" aria-label="Privacy"></a>
</body>
</html>
