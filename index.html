<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget: Chromium shrinks the layout viewport for the keyboard, so sticky just works there. Safari ignores it; app.js handles Safari (design/FREEZE.md). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#151d2b">
<meta name="color-scheme" content="dark">
<title>STEM drill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2839'/%3E%3Cpath d='M6 24C12 24 14 8 26 8' fill='none' stroke='%237ab8ff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e7edf6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/fonts/atkinson.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="design/explain-box.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="nav.css">
<script src="vendor/katex/katex.min.js" defer></script>
<script src="vendor/math.min.js" defer></script>
<script src="vendor/marked.min.js" defer></script>
<script src="design/explain-box.js" defer></script>
<script src="graph.js" defer></script>
<script type="module" src="app.js"></script>
<script type="module" src="nav.js"></script>
<!-- offline hook: offline.js (service worker registration, cache) is written separately; do not implement here -->
<script src="offline.js" defer></script>
</head>
<body>
<!-- impeccable-disable cramped-padding: the submit arrow sits flush inside its field on purpose (Tony, UI rules 3 and 4) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-go" viewBox="0 0 24 24"><path d="M4.5 12h14M13 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="8.5" y="2.5" width="7" height="4" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 12h7M8.5 16h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="12.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 5.5V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.6 7.5L20 18M8.6 16.5L20 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wait" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4.5H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5 4 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 7l3 3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6.5 3.5H14l4.5 4.5v11a1.5 1.5 0 0 1-1.5 1.5H6.5A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1.5-1.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 3.5V8h4.5M8.5 13h7M8.5 16.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9.5 6H20M9.5 12H20M9.5 18H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.75" cy="6" r="1.25" fill="currentColor"/><circle cx="4.75" cy="12" r="1.25" fill="currentColor"/><circle cx="4.75" cy="18" r="1.25" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <!-- Cluck the duck -->
    <symbol id="i-duck" viewBox="0 0 24 24"><path d="M9 4.5a4 4 0 0 1 4 4c0 1-.3 1.8-.8 2.5H17c1.5 0 2.7-.8 3.3-2 .8 1 1.2 2.3 1.2 3.7 0 4-3.4 6.8-8 6.8H9c-3.3 0-5.5-2.2-5.5-5 0-1.8 1-3.3 2.4-4.2A4 4 0 0 1 9 4.5z" fill="currentColor"/><path d="M12.8 7.8l3.4.9-3.4.9z" fill="var(--c2)"/><circle cx="9.8" cy="7.9" r="1" fill="var(--paper)"/></symbol>
  </defs>
</svg>

<header class="top">
  <!-- the entry box: top of the column on desktop, fixed bottom-centre on phones (one thumb) -->
  <div class="dock" id="dock">
    <p class="file-status" id="fileStatus" role="status" hidden></p>
    <form class="entry" id="entry" autocomplete="off" novalidate>
      <button type="button" class="btn" id="upload" aria-label="Open a problem file" title="Open a problem file">
        <svg class="ico" aria-hidden="true"><use href="#i-up"/></svg>
      </button>
      <div class="code-box">
        <input id="code" name="code" type="text" aria-label="Problem code" aria-describedby="entryMsg"
          maxlength="16" spellcheck="false" autocapitalize="characters" autocorrect="off" enterkeyhint="go">
        <button type="button" class="btn btn-go" id="codePaste" aria-label="Paste code" title="Paste code"><svg class="ico" aria-hidden="true"><use href="#i-paste"/></svg></button>
        <button type="submit" class="btn btn-go" id="codeGo" aria-label="Open problem" hidden><svg class="ico" aria-hidden="true"><use href="#i-go"/></svg></button>
      </div>
      <button type="button" class="btn" id="retryLoad" aria-label="Try again" title="Try again" hidden><svg class="ico" aria-hidden="true"><use href="#i-retry"/></svg></button>
    </form>
    <p class="entry-msg" id="entryMsg" role="status" aria-live="polite"></p>
  </div>
  <!-- question nav (design/NAV.md): only for an uploaded problems.json. Top bar on phones, beside the entry box on desktop.
       The list opens in the flow under it (it pushes the problem down; nothing is covered). -->
  <nav class="qnav" id="qnav" aria-label="Questions" hidden>
    <button type="button" class="btn btn-label" id="qlistBtn" aria-expanded="false" aria-controls="qlist">
      <svg class="ico" aria-hidden="true"><use href="#i-list"/></svg><span>Questions list</span>
    </button>
    <button type="button" class="btn" id="qprev" aria-label="Previous question" title="Previous question ([)" aria-keyshortcuts="[">
      <svg class="ico" aria-hidden="true"><use href="#i-prev"/></svg>
    </button>
    <button type="button" class="btn" id="qnext" aria-label="Next question" title="Next question (])" aria-keyshortcuts="]">
      <svg class="ico" aria-hidden="true"><use href="#i-next"/></svg>
    </button>
  </nav>
  <div class="qlist" id="qlist" hidden><ol></ol></div>
</header>

<main id="main">
  <div id="sentinel" aria-hidden="true"></div>
  <!-- Swap (design/SWAP.md): only while the phone keyboard is up. One icon toggle: document | pencil. -->
  <button type="button" class="btn btn-tgl" id="swap" data-pane="problem" aria-label="Show the scratchpad" hidden>
    <svg class="ico t-doc" aria-hidden="true"><use href="#i-doc"/></svg>
    <svg class="ico t-pen" aria-hidden="true"><use href="#i-pen"/></svg>
  </button>
  <!-- #stage is display:contents on the page as you know it; Swap turns it into the one-pane stage above the keyboard -->
  <div class="stage" id="stage">
  <section class="freeze" id="freeze" aria-labelledby="pcode" hidden>
    <div class="freeze-in" id="freezeIn">
      <article class="p" id="problem">
        <h1 class="pcode sr-only" id="pcode"></h1>
        <div class="blocks" id="blocks"></div>
      </article>
      <div class="q" id="q"></div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
    <button type="button" class="btn more" id="more" aria-expanded="false" aria-controls="freezeIn" aria-label="Show the whole problem" hidden>
      <svg class="ico" aria-hidden="true"><use href="#i-down"/></svg>
    </button>
  </section>

  <section class="work" id="work" hidden>
    <div class="xb" id="xb">
      <div class="xb-label" id="xbLabel"><svg class="ico" aria-hidden="true"><use href="#i-pen"/></svg><span id="xbName">Scratchpad</span><span class="xb-save" id="xbSave" role="status"></span></div>   <!-- not a <label>: tapping it must not refocus the box (it kept the keyboard up) -->
      <!-- the textarea (#scratch) is (re)created per problem, before the button, so edit history starts fresh.
           Copy sits inside the box's bottom-right corner; ExplainBox.reserveCorner keeps text out from under it. -->
      <div class="xb-field" id="xbField">
        <button type="button" class="btn xb-cut" id="cut" aria-label="Cut all: copy answer, scratchpad and history, then clear the scratchpad" title="Cut all">
          <svg class="ico" aria-hidden="true"><use href="#i-cut"/></svg>
        </button>
        <button type="button" class="btn xb-copy" id="copy" aria-label="Copy answer, scratchpad and history" title="Copy">
          <svg class="ico" aria-hidden="true"><use href="#i-copy"/></svg>
        </button>
      </div>
    </div>
  </section>
  </div>
</main>
<p class="sr-only" id="sr" aria-live="polite"></p>
</body>
</html>
