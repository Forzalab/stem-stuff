<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redo Button Variants</title>
<!-- Redo my misses: 5 looks inside STYLE.md + Refactoring UI (v2, Oct 6). The real app.css / nav.css / rewards.css and the real icon
     sprite (fetched from index.html), so every token and icon is true. Rules kept: colour only for state (§2.1, no new hue), one filled
     control (§3), fill-first buttons (§2.6), no side stripes, no counters in the bar (§3 List and nav: the list's own ticks show progress),
     2px sprite icons (§4). Refactoring UI: hierarchy by contrast and weight, emphasize by de-emphasizing, labels last.
     Violet lives only in the reward layer (E, sugar). Serve over http (the sprite fetch): python3 serve.py, then /try/redo-variants.html -->
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../nav.css">
<link rel="stylesheet" href="../rewards/rewards.css">
<style>
body { background: var(--paper); color: var(--ink); margin: 0; padding: var(--s4); }
main.vs { max-width: 72rem; margin: 0 auto; }
h1 { font-size: var(--t-md); margin: 0 0 var(--s2); }
.lead { color: var(--muted); font-size: var(--t-sm); margin: 0 0 var(--s5); max-width: 65ch; }
.v { background: var(--qbox); border-radius: 10px; padding: var(--s4); margin-bottom: var(--s4); }
.v h2 { margin: 0; font-size: var(--t-sm); }
.v p { margin: var(--s1) 0 var(--s3); color: var(--muted); font-size: var(--t-xs); max-width: 65ch; }
.lab { font-size: var(--t-xs); color: var(--hint); margin: var(--s3) 0 var(--s2); }
.row { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.row.phone { flex-wrap: nowrap; }
.row.phone .btn-label { min-width: 0; flex-shrink: 1; overflow: hidden; }   /* the mock row is a few px narrower than the app bar */
.cols > div { min-width: 0; }
@media (max-width: 26rem) { body { padding: var(--s4) 0; } h1, .lead { padding: 0 var(--s4); } .v { border-radius: 0; } }   /* a phone: the rows get the real 358px */
.row .push { margin-left: auto; }
.phone { max-width: calc(390px - 2 * var(--s4)); }
.cols { display: grid; gap: 0 var(--s6); }
@media (min-width: 60rem) { .cols { grid-template-columns: 22rem 1fr; } }
.mini { list-style: none; margin: var(--s2) 0 0; padding: var(--s2); background: var(--sheet); border-radius: 10px; display: grid; gap: 2px; }
.mini li { display: flex; align-items: center; gap: var(--s3); min-height: var(--btn); padding: 0 var(--s3); border-radius: 8px; font-size: var(--t-sm); }
.mini .qn { color: var(--muted); font-weight: 700; }
.mini .cur { background: var(--raised); } .mini .cur .qn { color: var(--c1); }
.mini .mk { margin-left: auto; display: flex; gap: 2px; }
.mini .mk .ico { width: 1.25rem; height: 1.25rem; }
.mk-ok { color: var(--ok); } .mk-x { color: var(--bad); }
.btn.on { background: var(--raised); }

/* B. Selected blue: --c1 means current / selected (§2.1) */
.vB .on { color: var(--c1); }
/* D. Look here: --mark as an underline only (the snack .chg precedent) */
.vD .lst.on span { text-decoration: underline; text-decoration-color: var(--mark); text-decoration-thickness: 2px; text-underline-offset: 6px; }
.vD .lst.on { background: var(--sheet); }
/* E. Sugar: the reward layer's violet bevel + sun icon (STYLE.md §3 Reward layer); diet shows A */
.vE .rwbtn { flex: none; height: var(--btn); padding: 0 var(--s4) 0 var(--s3); border: 0; border-radius: 12px; display: inline-flex; align-items: center; gap: var(--s2);
  font: 700 var(--t-sm)/1 var(--rw-font); color: var(--rw-lav); background: var(--rw-v600); box-shadow: inset 0 -3px 0 var(--rw-v900); }
.vE .rwbtn .ico { color: var(--rw-sun); }
.vE .rwbtn.ic { width: var(--btn); padding: 0; justify-content: center; }
</style>
</head>
<body>
<div id="sprite" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"></div>
<main class="vs">
<h1>Redo misses: 5 looks inside our style</h1>
<p class="lead">Each look follows STYLE.md: no new colour, one filled button, no counters in the bar, 2px sprite icons. In a round, progress shows as ticks in the list, like everywhere else.</p>
<div id="out"></div>
</main>
<script>
const ico = id => `<svg class="ico" aria-hidden="true"><use href="#${id}"/></svg>`;
const lbl = (id, t, cls = "") => `<button class="btn btn-label ${cls}">${ico(id)}<span>${t}</span></button>`;
const icb = (id, cls = "") => `<button class="btn ${cls}">${ico(id)}</button>`;
const arrows = `<button class="btn push" disabled>${ico("i-prev")}</button>${icb("i-next")}`;
const list = `<ol class="mini">
  <li><span class="qn">1</span><span>Satellite period at altitude h</span><span class="mk"><svg class="ico mk-ok"><use href="#i-ok"/></svg></span></li>
  <li class="cur"><span class="qn">2</span><span>Block, rough ramp and spring</span></li>
  <li><span class="qn">3</span><span>Collision, 30° and 60°</span></li></ol>`;
const idle = ph => `${lbl("i-list", "BANK_P2X", "lst")}${icb("i-shuffle")}${ph ? icb("i-redo") : lbl("i-redo", "Redo misses")}${arrows}`;
const V = [
  { k: "A", n: "A. Quiet toggle", why: "Calm Textbook, pure. In a round the redo button is 'on', like an open list (--raised fill). No hue; the state shows by contrast.",
    round: ph => `${lbl("i-list", "Redo", "lst")}${ph ? icb("i-redo", "on") : lbl("i-redo", "Exit redo", "on")}${arrows}` },
  { k: "B", n: "B. Selected blue", why: "--c1 already means current / selected. In a round the list button and the on button turn blue, like the current row: 'you are inside this'.",
    round: ph => `${lbl("i-redo", "Redo", "lst on")}${ph ? icb("i-redo", "on") : lbl("i-redo", "Exit redo", "on")}${arrows}` },
  { k: "C", n: "C. The list changes", why: "State on the thing it is about (§1.7). The list button becomes the round (redo icon + 'Redo'); the other button names where it goes: 'All questions'. No hue.",
    round: ph => `${lbl("i-redo", "Redo", "lst on")}${ph ? icb("i-list") : lbl("i-list", "All questions")}${arrows}` },
  { k: "D", n: "D. Look here", why: "--mark ('look here') as an underline only, the snack-number precedent. One short yellow line under 'Redo'; everything else neutral.",
    round: ph => `${lbl("i-redo", "Redo", "lst on")}${ph ? icb("i-list") : lbl("i-list", "All questions")}${arrows}` },
  { k: "E", n: "E. Sugar bevel", why: "Sugar only: the reward layer's violet bevel and sun icon, where the game look is allowed (§3 Reward layer). Diet shows A.",
    idle: ph => `${lbl("i-list", "BANK_P2X", "lst")}${icb("i-shuffle")}${ph ? `<span class="rwbtn ic">${ico("i-redo")}</span>` : `<span class="rwbtn">${ico("i-redo")}Redo misses</span>`}${arrows}`,
    round: ph => `${lbl("i-redo", "Redo", "lst on")}${ph ? `<span class="rwbtn ic">${ico("i-list")}</span>` : `<span class="rwbtn">${ico("i-list")}All questions</span>`}${arrows}` }
];
document.getElementById("out").innerHTML = V.map(v => `<section class="v v${v.k} ${v.k === "E" ? "rw-skin" : ""}">
  <h2>${v.n}</h2><p>${v.why}</p>
  <div class="cols"><div>
    <div class="lab">Phone, list open</div><div class="row phone">${(v.idle || idle)(true)}</div>
    <div class="lab">Phone, in a round</div><div class="row phone">${v.round(true)}</div>${list}</div>
  <div><div class="lab">Desktop, list open</div><div class="row">${(v.idle || idle)(false)}</div>
    <div class="lab">Desktop, in a round</div><div class="row">${v.round(false)}</div></div></div>
</section>`).join("");
fetch("../index.html").then(r => r.text()).then(t => {                // the app's own icon sprite
  const s = new DOMParser().parseFromString(t, "text/html").querySelector("svg symbol#i-list")?.closest("svg");
  if (s) document.getElementById("sprite").append(document.importNode(s, true));
}).catch(() => {});
</script>
</body>
</html>
